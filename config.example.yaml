# Authentication key; API calls must include Bearer {api-key} in the request header
api-key: chatgpt2api

# Global proxy address; leave empty to disable (supports HTTP/HTTPS/SOCKS5, etc.)
proxy: ""

# OpenAI-compatible API prefix address; leave empty to use the default
base_url: ""

# Global default system prompt (shared model context)
global_system_prompt: ""

# Model used for upstream web chat requests; auto lets the upstream choose automatically
default_upstream_model_name: auto

# Image-generation model name exposed externally; leave empty to use gpt-image-2.6
image_model_name: gpt-image-2.6

# Default model thinking effort (auto/low/medium/high/standard/extended/xhigh/max/ultra, depending on the account and model)
default_thinking_effort: auto

# Maximum request body size per request (MB); requests exceeding it are rejected outright
max_upload_mb: 50

# Account and token configuration
account:
  # Account refresh interval (minutes)
  refresh_interval_minute: 5
  # Whether to automatically remove invalid accounts
  auto_remove_invalid: true
  # Whether to remove the corresponding conversation after a chat ends
  remove_conversation_after_result: false


# Proxy runtime settings
proxy_runtime:
  # Whether to enable proxy runtime capabilities
  enabled: false
  # Proxy scheduling mode; currently supports single_proxy
  egress_mode: single_proxy
  # Default pass-through proxy address
  proxy_url: http://privoxy:8118
  # Dedicated proxy address for resource requests such as images/scripts
  resource_proxy_url: ""
  # Stable proxy (clearance) configuration
  clearance:
    # Unblock mode: flaresolverr
    mode: flaresolverr
    # Cloudflare cookies (JSON string)
    cf_cookies: ""
    # Cloudflare clearance cookie
    cf_clearance: ""
    # User agent used when accessing Cloudflare
    user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/157.0.0.0 Safari/537.36
    # FlareSolverr service address
    flaresolverr_url: http://flaresolverr:8191
    # Cloudflare preflight timeout (seconds)
    timeout_sec: 60
    # Clearance refresh interval (seconds)
    refresh_interval: 3600

# Image configuration
image:
  # Number of days to retain image files locally
  retention_days: 30
  # Image task polling timeout (seconds)
  poll_timeout_secs: 300
  # Initial polling interval for image tasks (seconds)
  poll_interval_secs: 5
  # First-round wait time for image tasks (seconds)
  poll_initial_wait_secs: 10
  # Number of concurrent accounts per image generation
  account_concurrency: 3
  # Number of retries that switch accounts when image generation fails (excluding content violations)
  account_retries: 2
  # Model used for image generation on the Codex route
  codex_model: gpt-6-luna
  # Model used by the drawing tool on the Codex route
  codex_image_model: gpt-image-2.6
  # Threshold for low remaining local image storage capacity (MB)
  min_free_mb: 500
  # Image storage configuration
  storage:
    # Whether to enable secondary image persistence
    enabled: false
    # Save mode: local or webdav
    mode: local
    # WebDAV service address
    webdav_url: ""
    # WebDAV username
    webdav_username: ""
    # WebDAV password
    webdav_password: ""
    # WebDAV root path
    webdav_root_path: chatgpt2api/images
    # Public base URL for image access
    public_base_url: ""

# Chat completion cache configuration
chat_completion_cache:
  # Whether to enable caching
  enabled: true
  # Cache TTL (seconds)
  ttl_seconds: 60
  # Maximum number of cache entries
  max_entries: 256
  # Whether to cache streamed response fragments
  stream_cache: true
  # Whether to normalize messages to improve cache hit rate
  normalize_messages: true
  # Whether to drop adjacent duplicate history messages
  drop_adjacent_duplicates: true
  # Whether to remove historical assistant messages (per policy)
  drop_assistant_history: false


