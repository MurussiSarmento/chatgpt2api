                  <td><input type="checkbox" class="toggle toggle-sm" :checked="item.enabled" :aria-label="item.enabled ? 'Disable' : 'Enable'" @change="toggle(item, $event.target.checked)"></td>
                  <td class="num text-muted nowrap" x-text="$time(item.created_at)"></td>
                  <td class="num text-muted nowrap" x-text="$time(item.last_used_at)"></td>
                  <td class="col-actions">
                    <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="Edit" aria-label="Edit" @click="openForm(item)"><ui-icon name="pencil" class="icon-sm"></ui-icon></button>
                    <button type="button" class="btn btn-ghost btn-sm btn-square tooltip text-danger" data-tip="Delete" aria-label="Delete" @click="remove(item)"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <div class="center-fill" x-show="loading"><span class="loading loading-spinner loading-sm"></span></div>
        <div class="empty" x-show="!loading && !filtered.length"><ui-icon name="key-round"></ui-icon><span x-text="query ? 'No matching keys' : 'No user keys yet'"></span></div>
        <ui-pager x-show="filtered.length > size" :page="page" :size="size" :total="filtered.length" @change="page = $event.detail.page; size = $event.detail.size"></ui-pager>
      </section>

      <dialog class="modal" x-effect="form.open ? $el.showModal() : $el.close()" @close="form.open = false">
        <form class="modal-box vstack" @submit.prevent="save()">
          <h3 class="modal-title" x-text="form.id ? 'Edit key' : 'New key'"></h3>
          <div class="field">
            <label class="field-label" for="key-name">Name</label>
            <input id="key-name" class="input input-sm" x-model="form.name" placeholder="Used to distinguish users">
          </div>
          <div class="field">
            <label class="field-label" for="key-value">Key</label>
            <input id="key-value" class="input input-sm mono" :class="{ 'input-error': form.error }" x-model="form.key" placeholder="Used for sign-in and calls" @input="form.error = ''">
            <span class="field-error" x-show="form.error" x-text="form.error"></span>
          </div>
          <div class="field">
            <span class="field-label">Plan</span>
            <ui-select class="block" multiple aria-label="Plan" x-model="form.plan"><option value="free">Free</option><option value="plus">Plus</option><option value="team">Team</option><option value="pro">Pro</option></ui-select>
          </div>
          <div class="field">
            <span class="field-label">Route</span>
            <ui-select class="block" multiple aria-label="Route" x-model="form.route"><option value="web">Web</option><option value="codex">Codex</option></ui-select>
          </div>
          <div class="modal-action">
            <button type="button" class="btn btn-sm" @click="form.open = false">Cancel</button>
            <button type="submit" class="btn btn-sm btn-primary" :disabled="!form.key || form.saving"><span class="loading loading-spinner loading-xs" x-show="form.saving"></span>Save</button>
          </div>
        </form>
        <form method="dialog" class="modal-backdrop"><button>Close</button></form>
      </dialog>
    </div>
  </template>

  <template id="page-gallery">
    <div class="page" x-data="gallery">
      <div class="page-head">
        <h1 class="title-page">Gallery</h1>
        <div class="row row-wrap">
          <button type="button" class="btn btn-sm" :disabled="busy" @click="compress()"><span class="loading loading-spinner loading-xs" x-show="busy === 'compress'"></span><ui-icon name="archive" class="icon-sm" x-show="busy !== 'compress'"></ui-icon>Compress &amp; optimize</button>
          <button type="button" class="btn btn-sm" :disabled="busy" @click="cleanup.open = true"><ui-icon name="eraser" class="icon-sm"></ui-icon>Clean up storage</button>
          <button type="button" class="btn btn-sm btn-error btn-soft" :disabled="busy" @click="byDate = { open: true, date: '' }"><ui-icon name="calendar-days" class="icon-sm"></ui-icon>Delete by date</button>
          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip tooltip-left" data-tip="Refresh" aria-label="Refresh" :disabled="loading" @click="load()"><ui-icon name="refresh-cw" class="icon-sm" :class="{ spin: loading }"></ui-icon></button>
        </div>
      </div>

      <div class="vstack vstack-lg">
        <template x-if="!storage">
          <div class="grid grid-4"><template x-for="i in 4"><div class="skeleton metric-skeleton"></div></template></div>
        </template>
        <template x-if="storage">
          <div class="grid grid-4">
            <div class="metric-tile">
              <div class="metric-label"><span>Total disk</span><ui-icon name="hard-drive" class="icon-sm"></ui-icon></div>
              <div class="metric-value" x-text="$bytes(storage.disk_total_mb * 1048576)"></div>
              <div class="metric-meta" x-text="'Used ' + $bytes(storage.disk_used_mb * 1048576)"></div>
            </div>
            <div class="metric-tile">
              <div class="metric-label"><span>Free space</span><ui-icon name="gauge" class="icon-sm"></ui-icon></div>
              <div class="metric-value" :class="storage.disk_free_mb < 200 ? 'text-danger' : storage.disk_free_mb < 500 ? 'text-warning' : ''" x-text="$bytes(storage.disk_free_mb * 1048576)"></div>
              <div class="metric-meta" x-text="(storage.disk_free_mb / storage.disk_total_mb * 100).toFixed(1) + '% available'"></div>
            </div>
            <div class="metric-tile">
              <div class="metric-label"><span>Image count</span><ui-icon name="images" class="icon-sm"></ui-icon></div>
              <div class="metric-value" x-text="$num(storage.image_count)"></div>
            </div>
            <div class="metric-tile">
              <div class="metric-label"><span>Image usage</span><ui-icon name="layers" class="icon-sm"></ui-icon></div>
              <div class="metric-value" x-text="$bytes(storage.image_size_bytes)"></div>        </div>
          </div>
        </template>

        <div class="row row-wrap">
          <ui-date class="gallery-range" mode="range" placeholder="Created date" x-model="range" @input="load()"></ui-date>
          <span class="spacer"></span>
          <div class="tabs tabs-box tabs-sm" role="tablist">
            <button type="button" role="tab" class="tab" :class="{ 'tab-active': view === 'card' }" @click="view = 'card'">Cards</button>
            <button type="button" role="tab" class="tab" :class="{ 'tab-active': view === 'table' }" @click="view = 'table'">Table</button>
          </div>
        </div>

        <section class="panel panel-flush">
          <div class="panel-head row-wrap">
            <div class="row row-lg row-wrap">
              <span class="text-muted" x-text="'Total ' + $num(items.length)"></span>
              <label class="check-row"><input type="checkbox" class="checkbox checkbox-sm" :checked="pageSelected" :disabled="!items.length" @change="toggle(paged.map((item) => item.rel), $event.target.checked)">Select page</label>
              <label class="check-row"><input type="checkbox" class="checkbox checkbox-sm" :checked="allSelected" :disabled="!items.length" @change="toggle(items.map((item) => item.rel), $event.target.checked)">Select all results</label>
              <span class="text-muted" x-show="selected.length" x-text="'Selected ' + selected.length"></span>
            </div>
            <div class="row row-wrap">
              <template x-if="selected.length">
                <div class="row">
                  <button type="button" class="btn btn-ghost btn-sm" @click="selected = []">Clear selection</button>
                  <button type="button" class="btn btn-sm" :disabled="busy" @click="downloadSelected()"><span class="loading loading-spinner loading-xs" x-show="busy === 'download'"></span><ui-icon name="download" class="icon-sm" x-show="busy !== 'download'"></ui-icon>Download selected</button>
                  <button type="button" class="btn btn-sm btn-error btn-soft" :disabled="busy" @click="remove({ paths: selected }, 'Delete selected images', `The ${selected.length} selected images cannot be recovered after deletion.`)"><ui-icon name="trash-2" class="icon-sm"></ui-icon>Delete selected</button>
                </div>
              </template>
              <button type="button" class="btn btn-sm btn-error btn-soft" x-show="filtered && !selected.length" :disabled="busy || !items.length" @click="remove({ ...filters, all_matching: true }, 'Delete matching images', `The ${items.length} filtered images cannot be recovered after deletion.`)"><ui-icon name="trash-2" class="icon-sm"></ui-icon>Delete filtered results</button>
            </div>
          </div>

          <div class="gallery-grid" x-show="view === 'card' && paged.length">
            <template x-for="item in paged" :key="item.rel">
              <div class="gallery-card vstack vstack-sm" :class="{ selected: selected.includes(item.rel) }">
                <div class="gallery-media">
                  <button type="button" class="thumb gallery-thumb" aria-label="Preview" @click="preview(item)">
                    <img :src="item.thumbnail_url" alt="" loading="lazy" @error="$el.src !== item.url && ($el.src = item.url)">
                  </button>
                  <input type="checkbox" class="checkbox checkbox-sm gallery-check" :checked="selected.includes(item.rel)" aria-label="Select" @change="toggle([item.rel], $event.target.checked)">
                  <span class="gallery-meta num" x-text="$bytes(item.size) + ' · ' + item.width + ' × ' + item.height"></span>
                </div>
                <div class="row">
                  <span class="grow truncate text-xs text-muted num" x-text="item.created_at"></span>
                  <button type="button" class="btn btn-ghost btn-xs btn-square tooltip" data-tip="Download" aria-label="Download" @click="download(item)"><ui-icon name="download" class="icon-sm"></ui-icon></button>
                  <button type="button" class="btn btn-ghost btn-xs btn-square tooltip" data-tip="Copy URL" aria-label="Copy URL" @click="$copy(item.url)"><ui-icon name="link-2" class="icon-sm"></ui-icon></button>
                  <button type="button" class="btn btn-ghost btn-xs btn-square tooltip text-danger" data-tip="Delete" aria-label="Delete" @click="remove({ paths: [item.rel] }, 'Delete image', 'Cannot be recovered after deletion.')"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
                </div>
              </div>
            </template>
          </div>

          <div class="table-wrap" x-show="view === 'table' && paged.length">
            <table class="table table-sm">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" class="checkbox checkbox-sm" aria-label="Select all on this page" :checked="pageSelected" @change="toggle(paged.map((item) => item.rel), $event.target.checked)"></th>
                  <th>Image</th><th>Name</th><th>Created</th><th>Dimensions</th><th>Size</th><th class="col-actions">Actions</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="item in paged" :key="item.rel">
                  <tr>
                    <td class="col-check"><input type="checkbox" class="checkbox checkbox-sm" :aria-label="'Select ' + item.name" :checked="selected.includes(item.rel)" @change="toggle([item.rel], $event.target.checked)"></td>
                    <td>
                      <button type="button" class="thumb gallery-thumb-sm" :aria-label="'Preview ' + item.name" @click="preview(item)">
                        <img :src="item.thumbnail_url" alt="" loading="lazy" @error="$el.src !== item.url && ($el.src = item.url)">
                      </button>
                    </td>
                    <td class="gallery-name"><span class="mono copyable truncate" title="Click to copy URL" x-text="item.name" @click="$copy(item.url)"></span></td>
                    <td class="num text-muted nowrap" x-text="item.created_at"></td>
                    <td class="num nowrap" x-text="item.width + ' × ' + item.height"></td>
                    <td class="num nowrap" x-text="$bytes(item.size)"></td>
                    <td class="col-actions">
                      <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="Preview" aria-label="Preview" @click="preview(item)"><ui-icon name="maximize-2" class="icon-sm"></ui-icon></button>
                      <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="Download" aria-label="Download" :disabled="busy" @click="download(item)"><ui-icon name="download" class="icon-sm"></ui-icon></button>
                      <button type="button" class="btn btn-ghost btn-sm btn-square tooltip text-danger" data-tip="Delete" aria-label="Delete" :disabled="busy" @click="remove({ paths: [item.rel] }, 'Delete image', `"${item.name}" cannot be recovered after deletion.`)"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <div class="center-fill" x-show="loading && !items.length"><span class="loading loading-spinner loading-sm"></span></div>
          <div class="empty" x-show="!loading && !items.length"><ui-icon name="images"></ui-icon><span x-text="filtered ? 'No matching images' : 'No images yet'"></span></div>
          <ui-pager x-show="items.length > 12" :page="page" :size="size" :total="items.length" sizes="12,24,48" @change="page = $event.detail.page; size = $event.detail.size"></ui-pager>
        </section>
      </div>

      <dialog class="modal" x-effect="byDate.open ? $el.showModal() : $el.close()" @close="byDate.open = false">
        <form class="modal-box vstack" @submit.prevent="removeByDate()">
          <h3 class="modal-title">Delete by date</h3>
          <div class="field">
            <span class="field-label">Delete all images from this day and earlier</span>
            <ui-date placeholder="Choose date" x-model="byDate.date"></ui-date>
          </div>
          <div role="alert" class="alert alert-soft alert-warning"><ui-icon name="triangle-alert"></ui-icon><span>Images and thumbnails will be permanently deleted and cannot be recovered.</span></div>
          <div class="modal-action">
            <button type="button" class="btn btn-sm" @click="byDate.open = false">Cancel</button>
            <button type="submit" class="btn btn-sm btn-error" :disabled="!byDate.date || busy"><span class="loading loading-spinner loading-xs" x-show="busy === 'delete'"></span>Delete</button>
          </div>
        </form>
        <form method="dialog" class="modal-backdrop"><button>Close</button></form>
      </dialog>

      <dialog class="modal" x-effect="cleanup.open ? $el.showModal() : $el.close()" @close="cleanup.open = false">
        <form class="modal-box vstack" @submit.prevent="cleanupSpace()">
          <h3 class="modal-title">Clean up storage</h3>
          <label class="field">
            <span class="field-label">Target free space<span class="tooltip tooltip-right field-help" data-tip="Delete from the oldest images until the disk free space reaches the target value"><ui-icon name="info" class="icon-sm"></ui-icon></span></span>
            <span class="input input-sm"><input type="number" x-model.number="cleanup.target"><span class="text-subtle">MB</span></span>
          </label>
          <div class="modal-action">
            <button type="button" class="btn btn-sm" @click="cleanup.open = false">Cancel</button>
            <button type="submit" class="btn btn-sm btn-error" :disabled="!cleanup.target || busy"><span class="loading loading-spinner loading-xs" x-show="busy === 'cleanup'"></span>Start cleanup</button>
          </div>
        </form>
        <form method="dialog" class="modal-backdrop"><button>Close</button></form>
      </dialog>
    </div>
  </template>

  <template id="page-logs">
    <div class="page" x-data="logs">
      <div class="page-head">
        <h1 class="title-page">Logs</h1>
        <div class="row row-wrap">
          <span class="logs-refresh" x-show="refreshedAt" x-text="'Last refreshed ' + refreshedAt"></span>
          <ui-date class="logs-range" mode="range" placeholder="Record date" x-model="range" @input="go(1, size)"></ui-date>
          <label class="check-row"><input type="checkbox" class="toggle toggle-sm" x-model="auto">Auto refresh</label>
          <ui-select x-model="interval" :disabled="!auto">
            <template x-for="value in ['3', '5', '10', '30', '60']" :key="value"><option :value="value" x-text="value + 's'"></option></template>
          </ui-select>
          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip tooltip-left" data-tip="Refresh" aria-label="Refresh" @click="load()"><ui-icon name="refresh-cw" class="icon-sm"></ui-icon></button>
        </div>
      </div>

      <div class="vstack">
        <div role="alert" class="alert alert-error alert-soft" x-show="error" x-cloak>
          <ui-icon name="circle-x"></ui-icon><span>Logs cannot be updated right now: <span x-text="error"></span></span>
        </div>

        <section class="panel panel-flush">
          <div class="panel-head" x-show="selected.length" x-cloak>
            <span class="text-muted" x-text="'Selected ' + selected.length"></span>
            <div class="row">
              <button type="button" class="btn btn-ghost btn-sm" @click="selected = []">Clear selection</button>
              <button type="button" class="btn btn-sm btn-error btn-soft" @click="remove([...selected])"><ui-icon name="trash-2" class="icon-sm"></ui-icon>Delete selected</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table table-sm">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" class="checkbox checkbox-sm" aria-label="Select all on this page" :checked="pageSelected" :disabled="!items.length" @change="selected = $event.target.checked ? items.map((log) => log.id) : []"></th>
                  <th>Time</th><th>Key name</th><th>Progress</th><th>Image</th><th>Endpoint</th><th class="col-actions">Actions</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="log in items" :key="log.id">
                  <tr>
                    <td class="col-check"><input type="checkbox" class="checkbox checkbox-sm" aria-label="Select log" :value="log.id" x-model="selected"></td>
                    <td class="num text-muted nowrap" x-text="$time(log.time)"></td>
                    <td class="nowrap" x-text="log.detail.key_name"></td>
                    <td class="logs-progress">
                      <div class="vstack vstack-xs">
                        <div class="row">
                          <ui-icon class="icon-sm" :class="status(log).tone + (log.detail.status === 'running' ? ' spin' : '')" :name="status(log).icon"></ui-icon>
                          <span class="grow truncate" :title="log.detail.stage" x-text="log.detail.stage"></span>
                          <span class="logs-duration num text-muted" x-text="$duration(duration(log))"></span>
                          <span class="badge badge-sm badge-soft" :class="status(log).badge" x-text="status(log).label"></span>
                        </div>
                        <progress class="progress logs-bar" :class="status(log).bar" :value="log.detail.status === 'running' ? null : 100" max="100"></progress>
                      </div>
                    </td>
                    <td>
                      <div class="row row-xs" x-show="urls(log).length">
                        <template x-for="(url, index) in urls(log).slice(0, 3)" :key="url">
                          <button type="button" class="thumb logs-thumb" aria-label="View image" @click="preview(log, index)">
                            <img :src="thumb(url)" alt="" loading="lazy" @error="$el.src !== url && ($el.src = url)">
                          </button>
                        </template>
                        <span class="text-xs text-muted" x-show="urls(log).length > 3" x-text="'+' + (urls(log).length - 3)"></span>
                      </div>
                      <span class="text-subtle" x-show="!urls(log).length">—</span>
                    </td>
                    <td class="logs-endpoint"><span class="mono truncate" :title="log.detail.endpoint" x-text="log.detail.endpoint"></span></td>
                    <td class="col-actions">
                      <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="Details" aria-label="Details" @click="detail = log; detailTab = 'overview'"><ui-icon name="eye" class="icon-sm"></ui-icon></button>
                      <button type="button" class="btn btn-ghost btn-sm btn-square tooltip tooltip-left text-danger" data-tip="Delete" aria-label="Delete" @click="remove([log.id])"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="center-fill" x-show="loading"><span class="loading loading-spinner loading-sm"></span></div>
          <div class="empty" x-show="!loading && !items.length"><ui-icon name="scroll-text"></ui-icon><span>No logs</span></div>
          <ui-pager x-show="total > 10" :page="page" :size="size" :total="total" @change="go($event.detail.page, $event.detail.size)"></ui-pager>
        </section>
      </div>

      <dialog class="modal" x-effect="detail ? $el.showModal() : $el.close()" @close="detail = null">
        <div class="modal-box logs-modal">
          <template x-if="detail">
            <div class="vstack">
              <div class="modal-head">
                <h3 class="modal-title">Call details</h3>
                <div class="tabs tabs-box tabs-sm" role="tablist">
                  <template x-for="[key, label] in [['overview', 'Overview'], ['events', 'Progress'], ['images', 'Images'], ['raw', 'Raw data']]" :key="key">
                    <button type="button" role="tab" class="tab" :class="{ 'tab-active': detailTab === key }" x-show="key !== 'images' || urls(detail).length" @click="detailTab = key" x-text="label"></button>
                  </template>
                </div>
                <button type="button" class="btn btn-ghost btn-sm btn-square" aria-label="Close" @click="detail = null"><ui-icon name="x" class="icon-sm"></ui-icon></button>
              </div>

              <div class="vstack vstack-lg" x-show="detailTab === 'overview'">
                <dl class="inline-stats">
                  <div><dt>Status</dt><dd class="row row-xs"><ui-icon class="icon-sm" :class="status(detail).tone" :name="status(detail).icon"></ui-icon><span x-text="status(detail).title"></span></dd></div>
                  <div><dt>Stage</dt><dd class="truncate" :title="detail.detail.stage" x-text="detail.detail.stage"></dd></div>
                  <div><dt>Duration</dt><dd class="num" x-text="$duration(duration(detail))"></dd></div>
                  <div><dt>Progress steps</dt><dd class="num" x-text="detail.detail.events.length"></dd></div>
                </dl>
                <dl class="logs-overview">
                  <div class="logs-item"><dt>Log ID</dt><dd><span class="mono copyable" title="Click to copy" x-text="detail.id" @click="$copy(detail.id)"></span></dd></div>
                  <div class="logs-item"><dt>Recorded time</dt><dd class="num" x-text="$time(detail.time)"></dd></div>
                  <div class="logs-item" :class="{ 'logs-item-long': detail.summary.length > 24 }"><dt>Summary</dt><dd x-text="detail.summary"></dd></div>
                  <template x-for="[key, value] in scalars" :key="key">
                    <div class="logs-item" :class="{ 'logs-item-long': String(value).length > 24 || String(value).includes('\n') }"><dt x-text="label(key)"></dt><dd class="pre-wrap" x-text="value"></dd></div>
                  </template>
                </dl>
              </div>

              <div x-show="detailTab === 'events'">
                <div class="empty" x-show="!detail.detail.events.length"><ui-icon name="list-tree"></ui-icon>No progress records</div>
                <ol class="logs-steps">
                  <template x-for="(event, index) in detail.detail.events" :key="index">
                    <li class="logs-step">
                      <ui-icon class="icon-sm logs-step-icon" :class="index === detail.detail.events.length - 1 ? status(detail).tone : 'text-success'" :name="index === detail.detail.events.length - 1 ? status(detail).icon : 'circle-check'"></ui-icon>
                      <div class="logs-step-body">
                        <div class="row row-between logs-step-head">
                          <span class="text-strong" x-text="event.message"></span>
                          <span class="text-xs text-muted num"><span x-text="event.time"></span><span class="logs-elapsed" x-text="$duration(event.elapsed_ms)"></span></span>
                        </div>
                        <dl class="kv logs-event-kv tile mono text-xs" x-show="Object.keys(event.detail ?? {}).some((key) => key !== 'position')">
                          <template x-for="[key, value] in Object.entries(event.detail ?? {}).filter(([key]) => key !== 'position')" :key="key">
                            <div class="logs-kv-row"><dt x-text="key"></dt><dd x-text="format(value)"></dd></div>
                          </template>
                        </dl>
                      </div>
                    </li>
                  </template>
                </ol>
              </div>

              <div class="logs-images" x-show="detailTab === 'images'">
                <template x-for="(url, index) in urls(detail)" :key="url">
                  <button type="button" class="thumb logs-image" aria-label="View image" @click="preview(detail, index)">
                    <img :src="thumb(url)" alt="" loading="lazy" @error="$el.src !== url && ($el.src = url)">
                  </button>
                </template>
              </div>

              <pre class="code" x-show="detailTab === 'raw'" x-text="json"></pre>
            </div>
          </template>
        </div>
        <form method="dialog" class="modal-backdrop"><button>Close</button></form>
      </dialog>
    </div>
  </template>

  <template id="page-settings">
    <div class="page page-split" x-data="settings">
      <div class="page-head">
        <h1 class="title-page">Settings</h1>
        <div class="row" x-show="config">
          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip tooltip-left" data-tip="Undo unsaved changes" aria-label="Undo unsaved changes" :disabled="busy || !dirty" @click="undo()"><ui-icon name="rotate-ccw" class="icon-sm"></ui-icon></button>
          <button type="button" class="btn btn-sm btn-primary" :disabled="busy || !dirty" @click="run('save', () => save())"><span class="loading loading-spinner loading-xs" x-show="busy === 'save'"></span>Save</button>
        </div>
      </div>

      <div class="center-fill" x-show="!config"><span class="loading loading-spinner loading-sm"></span></div>

      <template x-if="config">
        <div class="settings-layout">
          <nav class="settings-nav" aria-label="Settings groups">
            <template x-for="item in tabs" :key="item.key">
              <button type="button" class="nav-item" :aria-current="tab === item.key ? 'page' : null" @click="tab = item.key"><span class="grow" x-text="item.label"></span><span class="nav-dot" x-show="isDirty(item.key)" aria-label="Has unsaved changes"></span></button>
            </template>
          </nav>

          <section class="settings-body">
            <h2 class="settings-title" x-text="tabs.find((item) => item.key === tab).label"></h2>

            <!-- Global settings -->
            <div x-show="tab === 'global'">
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Image model name</div><p class="setting-desc">The image model name exposed externally; leave empty to use gpt-image-2.6.</p></div>
                <input class="input input-sm mono" x-model="config.image_model_name" placeholder="gpt-image-2.6">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Default upstream model</div><p class="setting-desc">The model used for upstream web chat, web image generation, and voice requests; auto lets the upstream choose automatically.</p></div>
                <input class="input input-sm mono" x-model="config.default_upstream_model_name" placeholder="auto">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Default thinking effort</div><p class="setting-desc">The level used when the model name does not specify a thinking effort.</p></div>
                <div class="tabs tabs-box tabs-sm segmented"><template x-for="[value, label] in thinking"><button type="button" class="tab" :class="{ 'tab-active': config.default_thinking_effort === value }" @click="config.default_thinking_effort = value" x-text="label"></button></template></div>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Codex image model</div><p class="setting-desc">The model called when the Codex route generates images.</p></div>
                <input class="input input-sm mono" x-model="config.image_codex_model" placeholder="gpt-6-luna">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Codex drawing model</div><p class="setting-desc">The model used by the drawing tool that actually generates images on the Codex route.</p></div>
                <input class="input input-sm mono" x-model="config.image_codex_image_model" placeholder="gpt-image-2.6">
              </div>
              <div class="setting-row setting-row-block">
                <div class="setting-text"><div class="setting-name">Global extra instruction</div><p class="setting-desc">Appended as a system instruction at the start of every conversation on each request.</p></div>
                <textarea class="textarea textarea-sm" rows="8" x-model="config.global_system_prompt" placeholder="Enter unified constraints or a role setup"></textarea>
              </div>
            </div>

            <!-- Account maintenance -->
            <div x-show="tab === 'account'">
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Account refresh interval</div><p class="setting-desc">How often account quotas and statuses are refreshed automatically.</p></div>
                <label class="input input-sm"><input type="number" x-model.number="config.refresh_account_interval_minute"><span class="text-subtle">minutes</span></label>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Auto-remove abnormal accounts</div><p class="setting-desc">Remove accounts from the pool when they are invalid or unusable.</p></div>
                <div class="tabs tabs-box tabs-sm segmented"><template x-for="[value, label] in onOff"><button type="button" class="tab" :class="{ 'tab-active': config.auto_remove_invalid_accounts === value }" @click="config.auto_remove_invalid_accounts = value" x-text="label"></button></template></div>
              </div>
            </div>

            <!-- Image generation -->
            <div x-show="tab === 'image'">
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Image access URL</div><p class="setting-desc">The URL prefix used for generated image result links.</p></div>
                <input class="input input-sm" x-model="config.base_url" placeholder="https://example.com">
              </div>
              <template x-for="item in imageNumbers" :key="item.key">
                <div class="setting-row">
                  <div class="setting-text"><div class="setting-name" x-text="item.label"></div><p class="setting-desc" x-text="item.desc"></p></div>
                  <label class="input input-sm"><input type="number" x-model.number="config[item.key]"><span class="text-subtle" x-text="item.unit"></span></label>
                </div>
              </template>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Remove local conversation after task ends</div><p class="setting-desc">Hide the corresponding conversation record after an image task completes, fails, or times out.</p></div>
                <div class="tabs tabs-box tabs-sm segmented"><template x-for="[value, label] in onOff"><button type="button" class="tab" :class="{ 'tab-active': config.remove_conversation_after_result === value }" @click="config.remove_conversation_after_result = value" x-text="label"></button></template></div>
              </div>
            </div>

            <!-- Image storage -->
            <div x-show="tab === 'storage'">
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Save location</div><p class="setting-desc">Save generated images locally, to WebDAV, or both.</p></div>
                <div class="tabs tabs-box tabs-sm segmented"><template x-for="[value, label] in storageModes"><button type="button" class="tab" :class="{ 'tab-active': config.image_storage.mode === value }" @click="config.image_storage.mode = value; config.image_storage.enabled = value !== 'local'" x-text="label"></button></template></div>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">WebDAV URL</div><p class="setting-desc">The access URL of the WebDAV service.</p></div>
                <input class="input input-sm" x-model="config.image_storage.webdav_url" :disabled="config.image_storage.mode === 'local'" placeholder="https://example.com/dav">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Username</div><p class="setting-desc">The username used to sign in to WebDAV.</p></div>
                <input class="input input-sm" x-model="config.image_storage.webdav_username" :disabled="config.image_storage.mode === 'local'" autocomplete="off">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Password</div><p class="setting-desc">The password used to sign in to WebDAV.</p></div>
                <input type="password" class="input input-sm" x-model="config.image_storage.webdav_password" :disabled="config.image_storage.mode === 'local'" autocomplete="new-password">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Remote directory</div><p class="setting-desc">The directory where images are saved in WebDAV.</p></div>
                <input class="input input-sm" x-model="config.image_storage.webdav_root_path" :disabled="config.image_storage.mode === 'local'" placeholder="chatgpt2api/images">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Public access prefix</div><p class="setting-desc">The URL prefix used to display images externally; when empty, images are accessed via this service's /images/ URL.</p></div>
                <input class="input input-sm" x-model="config.image_storage.public_base_url" :disabled="config.image_storage.mode === 'local'" placeholder="https://cdn.example.com/images">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Connection &amp; sync</div><p class="setting-desc">Save the current settings first, then test the connection or upload existing local images to WebDAV.</p></div>
                <div class="vstack vstack-xs">
                  <div class="row row-end">
                    <button type="button" class="btn btn-sm" :disabled="busy || config.image_storage.mode === 'local'" @click="testStorage()"><span class="loading loading-spinner loading-xs" x-show="busy === 'test-storage'"></span><ui-icon name="cloud" class="icon-sm" x-show="busy !== 'test-storage'"></ui-icon>Test connection</button>
                    <button type="button" class="btn btn-sm" :disabled="busy || config.image_storage.mode === 'local'" @click="syncStorage()"><span class="loading loading-spinner loading-xs" x-show="busy === 'sync'"></span><ui-icon name="refresh-cw" class="icon-sm" x-show="busy !== 'sync'"></ui-icon>Full sync</button>
                  </div>
                  <span class="text-xs text-right" :class="results.storage?.ok ? 'text-success' : 'text-danger'" x-show="results.storage" x-text="results.storage?.text"></span>
                </div>
              </div>
            </div>

            <!-- Network proxy -->
            <div x-show="tab === 'proxy'">
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Global proxy</div><p class="setting-desc">Accounts without their own proxy all use this proxy; supports HTTP, HTTPS, SOCKS5.</p></div>
                <div class="vstack vstack-xs">
                  <div class="input-group">
                    <input class="input input-sm" x-model="config.proxy" placeholder="http://127.0.0.1:7890" @input="results.proxy = null">
                    <button type="button" class="btn btn-sm" :disabled="busy || !config.proxy" @click="testProxy()"><span class="loading loading-spinner loading-xs" x-show="busy === 'test-proxy'"></span>Test</button>
                  </div>
                  <span class="text-xs" :class="results.proxy?.ok ? 'text-success' : 'text-danger'" x-show="results.proxy" x-text="results.proxy?.text"></span>
                </div>
              </div>
            </div>

            <!-- FlareSolverr -->
            <div x-show="tab === 'clearance'">
              <div role="alert" class="alert alert-soft alert-warning settings-alert">
                <ui-icon name="triangle-alert"></ui-icon>
                <span>Before use, start the flaresolverr, privoxy, and warp-proxy containers. Proxy priority: account proxy &gt; clearance proxy &gt; explicit proxy &gt; global proxy.</span>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Enable clearance</div><p class="setting-desc">Fetch clearance credentials and retry when a request is blocked by Cloudflare.</p></div>
                <div class="tabs tabs-box tabs-sm segmented"><template x-for="[value, label] in onOff"><button type="button" class="tab" :class="{ 'tab-active': config.proxy_runtime.enabled === value }" @click="config.proxy_runtime.enabled = value" x-text="label"></button></template></div>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Egress method</div><p class="setting-desc">Choose single proxy / WARP when deploying with WARP.</p></div>
                <div class="tabs tabs-box tabs-sm segmented"><template x-for="[value, label] in egressModes"><button type="button" class="tab" :class="{ 'tab-active': config.proxy_runtime.egress_mode === value }" :disabled="!config.proxy_runtime.enabled" @click="config.proxy_runtime.egress_mode = value" x-text="label"></button></template></div>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Clearance proxy URL</div><p class="setting-desc">Supports http, https, socks5; with authentication, write it as protocol://user:password@host:port.</p></div>
                <div class="vstack vstack-xs">
                  <div class="input-group">
                    <input class="input input-sm" x-model="config.proxy_runtime.proxy_url" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.egress_mode !== 'single_proxy'" placeholder="http://privoxy:8118">
                    <button type="button" class="btn btn-sm" :disabled="busy || !config.proxy_runtime.enabled" @click="testRuntimeProxy()"><span class="loading loading-spinner loading-xs" x-show="busy === 'test-runtime'"></span>Test</button>
                  </div>
                  <span class="text-xs" :class="results.runtime?.ok ? 'text-success' : 'text-danger'" x-show="results.runtime" x-text="results.runtime?.text"></span>
                </div>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Resource proxy URL</div><p class="setting-desc">The proxy used when downloading resources such as images; uses the clearance proxy when empty.</p></div>
                <input class="input input-sm" x-model="config.proxy_runtime.resource_proxy_url" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.egress_mode !== 'single_proxy'">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Credential method</div><p class="setting-desc">Enter the Cookie manually, or fetch it automatically via FlareSolverr.</p></div>
                <div class="tabs tabs-box tabs-sm segmented"><template x-for="[value, label] in clearanceModes"><button type="button" class="tab" :class="{ 'tab-active': config.proxy_runtime.clearance.mode === value }" :disabled="!config.proxy_runtime.enabled" @click="config.proxy_runtime.clearance.mode = value" x-text="label"></button></template></div>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">FlareSolverr URL</div><p class="setting-desc">Usually http://flaresolverr:8191 for container deployments.</p></div>
                <input class="input input-sm" x-model="config.proxy_runtime.clearance.flaresolverr_url" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.clearance.mode !== 'flaresolverr'" placeholder="http://flaresolverr:8191">
              </div>
              <template x-for="item in clearanceNumbers" :key="item.key">
                <div class="setting-row">
                  <div class="setting-text"><div class="setting-name" x-text="item.label"></div><p class="setting-desc" x-text="item.desc"></p></div>
                  <label class="input input-sm"><input type="number" x-model.number="config.proxy_runtime.clearance[item.key]" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.clearance.mode === 'none'"><span class="text-subtle">s</span></label>
                </div>
              </template>
              <div class="setting-row setting-row-block">
                <div class="setting-text"><div class="setting-name">User-Agent</div><p class="setting-desc">The browser identifier sent when fetching and using clearance credentials.</p></div>
                <input class="input input-sm mono" x-model="config.proxy_runtime.clearance.user_agent" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.clearance.mode === 'none'">
              </div>
              <div class="setting-row setting-row-block">
                <div class="setting-text"><div class="setting-name">Manual Cookie</div><p class="setting-desc" x-text="config.proxy_runtime.clearance.has_cf_cookies || config.proxy_runtime.clearance.has_cf_clearance ? 'A Cookie has been saved; saving empty will not clear it, and the original value is no longer shown after saving.' : 'The original value is no longer shown after saving.'"></p></div>
                <textarea class="textarea textarea-sm mono" rows="3" x-model="config.proxy_runtime.clearance.cf_cookies" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.clearance.mode !== 'manual'" placeholder="foo=bar; cf_clearance=..."></textarea>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">cf_clearance only</div><p class="setting-desc">Enter only the cf_clearance value.</p></div>
                <input class="input input-sm mono" x-model="config.proxy_runtime.clearance.cf_clearance" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.clearance.mode !== 'manual'">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Test credential fetch</div><p class="setting-desc">Save the current settings first, then fetch clearance credentials once for the target URL.</p></div>
                <div class="vstack vstack-xs">
                  <div class="input-group">
                    <input class="input input-sm" x-model="targetUrl" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.clearance.mode === 'none'">
                    <button type="button" class="btn btn-sm" :disabled="busy || !config.proxy_runtime.enabled || config.proxy_runtime.clearance.mode === 'none'" @click="testClearance()"><span class="loading loading-spinner loading-xs" x-show="busy === 'test-clearance'"></span>Test</button>
                  </div>
                  <span class="text-xs" :class="results.clearance?.ok ? 'text-success' : 'text-danger'" x-show="results.clearance" x-text="results.clearance?.text"></span>
                </div>
              </div>
            </div>
          </section>
        </div>
      </template>
    </div>
  </template>

  <template id="page-docs">
    <div class="page docs" x-data="docs">
      <nav class="docs-nav" aria-label="Documentation contents">
        <div class="nav-group">Getting started</div>
        <template x-for="[id, label] in guides" :key="id">
          <button type="button" class="nav-item" :aria-current="active === id ? 'page' : null" x-text="label" @click="jump(id)"></button>
        </template>
        <div class="nav-group">Endpoints</div>
        <template x-for="(item, index) in docs" :key="item.path">
          <button type="button" class="nav-item" :aria-current="active === 'endpoint-' + index ? 'page' : null" @click="jump('endpoint-' + index)">
            <span class="docs-method mono" :class="item.method === 'GET' ? 'text-success' : 'text-muted'" x-text="item.method"></span>
            <span class="truncate" x-text="item.title"></span>
          </button>
        </template>
      </nav>

      <article class="docs-body vstack vstack-lg">
        <section id="overview" class="docs-section vstack vstack-md">
          <div class="row">
            <h1 class="title-page">API Docs</h1>
            <span class="tooltip tooltip-right field-help" data-tip="Third-party apps can call models, chat, search, image generation, and editable file tasks through the OpenAI-compatible protocol; all endpoints use a unified address and Bearer Token authentication."><ui-icon name="info" class="icon-sm"></ui-icon></span>
          </div>
          <div class="grid grid-2">
            <div class="panel vstack vstack-xs">
              <span class="field-label">Service URL</span>
              <span class="mono copyable break-all" title="Click to copy" x-text="base" @click="$copy(base)"></span>
            </div>
            <div class="panel vstack vstack-xs">
              <span class="field-label">OpenAI Base URL</span>
              <span class="mono copyable break-all" title="Click to copy" x-text="base + '/v1'" @click="$copy(base + '/v1')"></span>
            </div>
          </div>
        </section>

        <section id="authentication" class="docs-section vstack vstack-md">
          <div class="row">
            <h2 class="title-section">Authentication</h2>
            <span class="tooltip tooltip-right field-help" data-tip="Each request carries the API Key in the Authorization Header."><ui-icon name="info" class="icon-sm"></ui-icon></span>
          </div>
          <pre class="code copyable" title="Click to copy" x-text="'Authorization: Bearer ' + key" @click="$copy('Authorization: Bearer ' + key)"></pre>
        </section>

        <section id="models" class="docs-section vstack vstack-md">
          <div class="row">
            <h2 class="title-section">Available models</h2>
          </div>
          <div class="row row-wrap">
            <template x-for="model in models" :key="model">
              <ui-model :name="model"></ui-model>
            </template>
          </div>
        </section>

        <template x-for="(item, index) in docs" :key="item.path">
          <section :id="'endpoint-' + index" class="docs-section vstack vstack-md">
            <div class="vstack vstack-xs">
              <h2 class="title-section" x-text="item.title"></h2>
              <div class="row">
                <span class="badge badge-sm badge-soft mono" :class="item.method === 'GET' ? 'badge-success' : 'badge-neutral'" x-text="item.method"></span>
                <code class="mono text-muted break-all" x-text="item.path"></code>
              </div>
            </div>
            <div class="grid grid-2">
              <template x-for="[label, rows] in [['Input parameters', item.input], ['Output parameters', item.output]]" :key="label">
                <div class="vstack vstack-sm">
                  <h3 class="field-label" x-text="label"></h3>
                  <div class="panel panel-flush">
                    <div class="table-wrap">
                      <table class="table table-sm">
                        <thead><tr><th>Parameter</th><th>Type</th><th>Description</th></tr></thead>
                        <tbody>
                          <template x-for="[name, type, desc] in rows" :key="name">
                            <tr><td class="mono nowrap" x-text="name"></td><td class="mono text-muted" x-text="type"></td><td class="text-muted" x-text="desc"></td></tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </template>
            </div>
            <div class="vstack vstack-sm">
              <h3 class="field-label">Request example</h3>
              <pre class="code copyable" title="Click to copy" x-text="item.example(base, key)" @click="$copy(item.example(base, key))"></pre>
            </div>
          </section>
        </template>
      </article>
    </div>
  </template>
</body>
</html>
