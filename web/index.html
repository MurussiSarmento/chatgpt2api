  <div class="drawer app" x-data :class="{ 'lg:drawer-open': $store.app.nav }">
    <input id="nav-drawer" type="checkbox" class="drawer-toggle" x-model="$store.app.navOpen">

    <div class="drawer-content shell-content">
      <div class="mobile-bar" x-show="$store.app.nav" x-cloak>
        <label for="nav-drawer" class="btn btn-ghost btn-sm btn-square" aria-label="Open navigation"><ui-icon name="menu"></ui-icon></label>
        <span class="brand-name">ChatGPT2API</span>
      </div>
      <main class="main" id="view"></main>
    </div>

    <div class="drawer-side" x-show="$store.app.nav" x-cloak>
      <label for="nav-drawer" class="drawer-overlay" aria-label="Close navigation"></label>
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-name">ChatGPT2API</span>
          <button type="button" class="brand-version" x-text="'v' + $store.app.version" :data-new="$store.app.hasUpdate" @click="$store.app.openReleases()"></button>
          <span class="spacer"></span>
          <a class="btn btn-ghost btn-xs btn-square tooltip tooltip-bottom" data-tip="GitHub" href="https://github.com/basketikun/chatgpt2api" target="_blank" rel="noreferrer" aria-label="GitHub"><ui-icon name="github" class="icon-sm"></ui-icon></a>
        </div>

        <nav class="nav">
          <template x-for="item in $store.app.navItems" :key="item.path ?? item.group">
            <div>
              <template x-if="item.group"><div class="nav-group" x-text="item.group"></div></template>
              <template x-if="item.path">
                <a class="nav-item" :href="item.path" :aria-current="$store.app.path === item.path ? 'page' : null" @click="$store.app.navOpen = false">
                  <ui-icon :name="item.icon"></ui-icon>
                  <span x-text="item.label"></span>
                </a>
              </template>
            </div>
          </template>
        </nav>

        <div class="sidebar-foot">
          <span class="grow truncate text-muted" x-text="$store.app.session?.name || ($store.app.session?.role === 'admin' ? 'Admin' : 'User')"></span>
          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip tooltip-top" data-tip="Sign out" aria-label="Sign out" @click="$store.app.logout()"><ui-icon name="log-out"></ui-icon></button>
        </div>
      </aside>
    </div>
  </div>

  <!-- Global toast: only carries failures, waiting, and messages that need attention -->
  <div class="toast toast-top toast-center" x-data>
    <template x-for="item in $store.toast.items" :key="item.id">
      <div class="alert alert-soft" :class="{ 'alert-error': item.type === 'error', 'alert-warning': item.type === 'warning', 'alert-info': item.type === 'info', 'alert-success': item.type === 'success' }" role="status">
        <ui-icon :name="item.icon || { error: 'circle-x', warning: 'triangle-alert', success: 'circle-check', info: 'info' }[item.type]"></ui-icon>
        <span x-text="item.text"></span>
      </div>
    </template>
  </div>

  <!-- Global confirm dialog -->
  <dialog class="modal" x-data x-effect="$store.confirm.open ? $el.showModal() : $el.close()" @close="$store.confirm.open && $store.confirm.done(false)">
    <div class="modal-box">
      <h3 class="modal-title" x-text="$store.confirm.title"></h3>
      <p class="text-muted" x-show="$store.confirm.text" x-text="$store.confirm.text"></p>
      <div class="modal-action">
        <button type="button" class="btn btn-sm" @click="$store.confirm.done(false)">Cancel</button>
        <button type="button" class="btn btn-sm" :class="$store.confirm.danger ? 'btn-error' : 'btn-primary'" x-text="$store.confirm.ok" @click="$store.confirm.done(true)"></button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>Close</button></form>
  </dialog>

  <!-- Version update -->
  <dialog class="modal" x-data x-effect="$store.app.releasesOpen ? $el.showModal() : $el.close()" @close="$store.app.releasesOpen = false">
    <div class="modal-box modal-md">
      <div class="row row-between modal-title">
        <span>Version update</span>
        <span class="text-xs text-muted num">Current v<span x-text="$store.app.version"></span> · Latest v<span x-text="$store.app.latest || '—'"></span></span>
      </div>
      <div x-show="$store.app.checking" class="center-fill"><span class="loading loading-spinner loading-sm"></span></div>
      <div class="vstack vstack-lg" x-show="!$store.app.checking">
        <template x-for="release in $store.app.releases" :key="release.version">
          <section class="vstack vstack-sm">
            <div class="row">
              <span class="title-section num" x-text="release.version === 'Unreleased' ? 'Unreleased' : 'v' + release.version"></span>
              <span class="badge badge-sm badge-soft" x-show="release.version === $store.app.version">Current</span>
              <span class="spacer"></span>
              <span class="text-xs text-subtle num" x-text="release.date"></span>
            </div>
            <template x-for="item in release.items">
              <div class="row row-start">
                <span class="badge badge-sm badge-soft shrink-0" :class="{ 'badge-success': item.type === 'New', 'badge-info': item.type === 'Fixed' }" x-text="item.type"></span>
                <div class="markdown text-muted" x-html="$md(item.content)"></div>
              </div>
            </template>
          </section>
        </template>
      </div>
      <div class="modal-action">
        <a class="btn btn-sm" :class="$store.app.hasUpdate ? 'btn-primary' : ''" href="https://github.com/basketikun/chatgpt2api" target="_blank" rel="noreferrer">Go to GitHub<ui-icon name="external-link" class="icon-sm"></ui-icon></a>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>Close</button></form>
  </dialog>

  <!-- Image viewer -->
  <div class="lightbox" x-data x-show="$store.lightbox.open" x-cloak
       @keydown.escape.window="$store.lightbox.open = false"
       @keydown.left.window="$store.lightbox.open && $store.lightbox.index > 0 && ($store.lightbox.index--, $store.lightbox.zoom = false)"
       @keydown.right.window="$store.lightbox.open && $store.lightbox.index < $store.lightbox.images.length - 1 && ($store.lightbox.index++, $store.lightbox.zoom = false)"
       @click.self="$store.lightbox.open = false">
    <template x-if="$store.lightbox.open">
      <img :src="$store.lightbox.images[$store.lightbox.index].src" alt="" :class="{ zoomed: $store.lightbox.zoom }" @click="$store.lightbox.zoom = !$store.lightbox.zoom">
    </template>
    <div class="lightbox-bar row">
      <span class="chip num" x-show="$store.lightbox.images[$store.lightbox.index]?.meta" x-text="$store.lightbox.images[$store.lightbox.index]?.meta"></span>
      <span class="chip num" x-show="$store.lightbox.images.length > 1" x-text="($store.lightbox.index + 1) + ' / ' + $store.lightbox.images.length"></span>
      <a class="btn btn-sm btn-circle" :href="$store.lightbox.images[$store.lightbox.index]?.src" download aria-label="Download image"><ui-icon name="download"></ui-icon></a>
      <button type="button" class="btn btn-sm btn-circle" aria-label="Close" @click="$store.lightbox.open = false"><ui-icon name="x"></ui-icon></button>
    </div>
    <button type="button" class="lightbox-nav lightbox-prev btn btn-circle" aria-label="Previous" x-show="$store.lightbox.index > 0" @click="$store.lightbox.index--; $store.lightbox.zoom = false"><ui-icon name="chevron-left"></ui-icon></button>
    <button type="button" class="lightbox-nav lightbox-next btn btn-circle" aria-label="Next" x-show="$store.lightbox.index < $store.lightbox.images.length - 1" @click="$store.lightbox.index++; $store.lightbox.zoom = false"><ui-icon name="chevron-right"></ui-icon></button>
  </div>

  <!-- Page templates: routes are cloned by id into the main content area -->
  <template id="page-login">
    <div class="login" x-data="login">
      <form class="login-card vstack vstack-lg" @submit.prevent="submit">
        <div class="vstack login-hero">
          <ui-icon name="openai" class="login-logo"></ui-icon>
          <h1 class="login-title">ChatGPT2API</h1>
          <p class="login-sub">Chat, image generation, files, and voice — all with one key</p>
        </div>
        <div class="field">
          <label class="field-label" for="login-key">Access key</label>
          <label class="input" :class="{ 'input-error': error }">
            <ui-icon name="key-round" class="text-subtle"></ui-icon>
            <input id="login-key" :type="visible ? 'text' : 'password'" x-model="key" autocomplete="current-password" autofocus @input="error = ''">
            <button type="button" class="btn btn-ghost btn-xs btn-square" :aria-label="visible ? 'Hide key' : 'Show key'" @click="visible = !visible"><ui-icon :name="visible ? 'eye-off' : 'eye'" class="icon-sm"></ui-icon></button>
          </label>
          <span class="field-error" x-show="error" x-text="error"></span>
        </div>
        <button type="submit" class="btn btn-primary" :disabled="!key || loading">
          <span class="loading loading-spinner loading-xs" x-show="loading"></span>Sign in
        </button>
      </form>
      <a class="row login-github" href="https://github.com/basketikun/chatgpt2api" target="_blank" rel="noreferrer"><ui-icon name="github" class="icon-sm"></ui-icon>basketikun/chatgpt2api</a>
    </div>
  </template>

  <template id="page-overview">
    <div class="page" x-data="overview">
      <div class="page-head">
        <h1 class="title-page">Overview</h1>
        <div class="row">
          <div class="tabs tabs-box tabs-sm" role="tablist">
            <button type="button" role="tab" class="tab" :class="{ 'tab-active': period === '24h' }" @click="period = '24h'">24 hours</button>
            <button type="button" role="tab" class="tab" :class="{ 'tab-active': period === '7d' }" @click="period = '7d'">7 days</button>
          </div>
          <button type="button" class="btn btn-sm tooltip tooltip-left" :data-tip="calls ? 'Updated at ' + $time(calls.sampled_at) : null" :disabled="loading" @click="refresh()">
            <ui-icon name="refresh-cw" class="icon-sm" :class="{ spin: loading }"></ui-icon>Refresh
          </button>
        </div>
      </div>

      <div class="vstack vstack-lg">
        <div role="alert" class="alert alert-error alert-soft" x-show="callsError" x-cloak>
          <ui-icon name="circle-x"></ui-icon><span>Call statistics cannot be updated right now: <span x-text="callsError"></span></span>
        </div>

        <template x-if="!calls && !callsError">
          <div class="grid grid-4"><template x-for="i in 4"><div class="skeleton metric-skeleton"></div></template></div>
        </template>

        <template x-if="calls">
          <div class="vstack vstack-lg">
            <div class="grid grid-4">
              <template x-for="metric in metrics" :key="metric.label">
                <div class="metric-tile">
                  <div class="metric-label"><span x-text="metric.label"></span><ui-icon :name="metric.icon" class="icon-sm"></ui-icon></div>
                  <div class="metric-value" x-text="metric.value"></div>
                  <div class="metric-meta" x-text="metric.meta"></div>
                </div>
              </template>
            </div>

            <div class="grid grid-main-side">
              <section class="panel">
                <div class="panel-head"><h2 class="title-section">Call trends</h2></div>
                <div class="chart-box" x-show="calls.summary.total"><canvas x-ref="trend" aria-label="Successful, failed, and in-progress calls per period"></canvas></div>
                <div class="empty chart-box" x-show="!calls.summary.total"><ui-icon name="activity"></ui-icon>No calls in this period</div>
              </section>

              <section class="panel">
                <div class="panel-head"><h2 class="title-section">Model calls</h2></div>
                <div class="table-wrap">
                  <table class="table table-sm">
                    <thead><tr><th>Model</th><th class="text-right">Calls</th><th class="text-right">Success rate</th></tr></thead>
                    <tbody>
                      <template x-for="model in pagedModels" :key="model.model">
                        <tr>
                          <td><ui-model :name="model.model" x-show="model.model"></ui-model><span class="text-subtle" x-show="!model.model">No model specified</span></td>
                          <td class="text-right num" x-text="$num(model.total)"></td>
                          <td class="text-right num" x-text="rate(model.success_rate)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
                <div class="empty" x-show="!calls.models.length"><ui-icon name="list-tree"></ui-icon>No model calls</div>
                <ui-pager x-show="calls.models.length > modelSize" :page="modelPage" :size="modelSize" :total="calls.models.length" sizes="8,20,50" @change="modelPage = $event.detail.page; modelSize = $event.detail.size"></ui-pager>
              </section>
            </div>
          </div>
        </template>

        <section class="vstack vstack-md">
          <div class="row">
            <h2 class="title-section">System resources</h2>
            <span class="tooltip tooltip-right field-help" data-tip="Memory is this service process's own usage; overall system usage is shown in the note below; disk is the disk where the run directory resides."><ui-icon name="info" class="icon-sm"></ui-icon></span>
          </div>
          <div role="alert" class="alert alert-error alert-soft" x-show="systemError" x-cloak>
            <ui-icon name="circle-x"></ui-icon><span>System resources cannot be updated right now: <span x-text="systemError"></span></span>
          </div>
          <div role="alert" class="alert alert-warning alert-soft" x-show="system && Object.keys(system.errors).length" x-cloak>
            <ui-icon name="triangle-alert"></ui-icon><span>Some resources cannot be read right now: <span x-text="system && Object.values(system.errors).join('; ')"></span></span>
          </div>
          <div class="grid grid-2">
            <template x-for="item in resources" :key="item.label">
              <div class="metric-tile">
                <div class="metric-label"><span x-text="item.label"></span><span class="tooltip tooltip-left" :data-tip="item.tip"><ui-icon :name="item.icon" class="icon-sm"></ui-icon></span></div>
                <div class="metric-value" x-text="item.percent == null ? '—' : item.percent.toFixed(1) + '%'"></div>
                <progress class="progress" :class="item.percent >= 90 ? 'progress-error' : 'progress-neutral'" :value="item.percent ?? 0" max="100"></progress>
                <div class="metric-meta num" x-text="item.meta"></div>
              </div>
            </template>
          </div>
        </section>
      </div>
    </div>
  </template>

  <template id="page-chat">
    <div class="workspace chat-page" x-data="chat">
      <div class="chat-scrim" x-show="sideOpen" x-cloak @click="sideOpen = false"></div>

      <aside class="chat-side" :class="{ open: sideOpen }">
        <div class="brand" x-show="!$store.app.admin" x-cloak>
          <span class="brand-name">ChatGPT2API</span>
          <button type="button" class="brand-version" x-text="'v' + $store.app.version" :data-new="$store.app.hasUpdate" @click="$store.app.openReleases()"></button>
          <span class="spacer"></span>
          <a class="btn btn-ghost btn-xs btn-square tooltip tooltip-bottom" data-tip="GitHub" href="https://github.com/basketikun/chatgpt2api" target="_blank" rel="noreferrer" aria-label="GitHub"><ui-icon name="github" class="icon-sm"></ui-icon></a>
          <button type="button" class="btn btn-ghost btn-xs btn-square tooltip tooltip-bottom" data-tip="Sign out" aria-label="Sign out" @click="$store.app.logout()"><ui-icon name="log-out" class="icon-sm"></ui-icon></button>
        </div>
        <button type="button" class="btn btn-sm chat-new" @click="newRecord()"><ui-icon name="square-pen" class="icon-sm"></ui-icon>New</button>
        <div class="row row-between chat-side-head">
          <span>Records <span class="num" x-text="list.length"></span></span>
          <button type="button" class="btn btn-ghost btn-xs btn-square btn-plain text-danger" aria-label="Clear all" x-show="list.length" :disabled="loading" @click="clearAll()"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
        </div>
        <nav class="chat-list" aria-label="Creation history">
          <template x-for="item in list" :key="item.id">
            <div class="chat-item" :aria-current="activeId === item.id ? 'true' : null">
              <button type="button" class="chat-item-title" :title="item.title" @click="select(item.id)">
                <ui-icon :name="recordIcons[item.type]" class="icon-sm text-subtle"></ui-icon>
                <span class="truncate" x-text="item.title"></span>
              </button>
              <button type="button" class="btn btn-ghost btn-xs btn-square chat-item-delete tooltip tooltip-left" data-tip="Delete" aria-label="Delete" :disabled="loading" @click="remove(item)"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
            </div>
          </template>
          <div class="empty" x-show="!list.length"><ui-icon name="history"></ui-icon>No records</div>
        </nav>
      </aside>

      <section class="chat-main">
        <button type="button" class="btn btn-ghost btn-sm btn-square chat-menu" aria-label="Creation history" @click="sideOpen = true"><ui-icon name="panel-left"></ui-icon></button>

        <div class="chat-stream" x-show="messages.length" x-effect="follow($el)">
          <div class="chat-thread">
            <template x-for="(message, index) in messages" :key="activeId + '-' + index">
              <div class="chat-msg" :class="message.role">
                <template x-if="message.role === 'user'">
                  <div class="vstack vstack-sm chat-user">
                    <div class="chat-user-images" x-show="parts(message, 'image_url').length">
                      <template x-for="(part, imageIndex) in parts(message, 'image_url')" :key="imageIndex">
                        <figure class="chat-user-image">
                          <button type="button" class="chat-zoom" @click="lightbox(parts(message, 'image_url').map((item) => ({ src: item.image_url.url })), imageIndex)"><img :src="part.image_url.url" alt="" loading="lazy"></button>
                          <button type="button" class="btn btn-ghost btn-xs" @click="addToEdit(part.image_url.url, 'image-' + (imageIndex + 1) + '.png')"><ui-icon name="image-plus" class="icon-sm"></ui-icon>Add to edit</button>
                        </figure>
                      </template>
                    </div>
                    <template x-for="part in parts(message, 'audio_file')" :key="part.name">
                      <div class="tile row chat-audio-file">
                        <ui-icon name="mic" class="icon-sm"></ui-icon>
                        <span class="truncate" x-text="part.name"></span>
                        <span class="text-xs text-subtle num" x-text="$bytes(part.size)"></span>
                      </div>
                    </template>
                    <div class="bubble" x-show="text(message)" x-text="text(message)"></div>
                    <template x-if="messages[index + 1]?.image_turn">
                      <div class="row row-xs chat-user-meta">
                        <span class="text-xs text-muted num" x-text="turnMeta(messages[index + 1].image_turn)"></span>
                        <button type="button" class="btn btn-ghost btn-xs" :disabled="loading" @click="reuseTurn(messages[index + 1].image_turn)"><ui-icon name="sliders-horizontal" class="icon-sm"></ui-icon>Reuse settings</button>
                      </div>
                    </template>
                  </div>
                </template>

                <template x-if="message.role === 'assistant'">
                  <div class="vstack vstack-md">
                    <template x-for="part in parts(message, 'audio')" :key="part.url.length">
                      <audio controls class="chat-audio" :src="part.url"></audio>
                    </template>

                    <div class="chat-tasks" :class="{ single: parts(message, 'image_task').length === 1 }" x-show="parts(message, 'image_task').length">
                      <template x-for="part in parts(message, 'image_task')" :key="part.task_id">
                        <div class="chat-task">
                          <div class="chat-task-media" :class="{ 'chat-task-loading': part.status === 'running' || part.status === 'queued' }" :style="{ aspectRatio: part.ratio === 'auto' ? '1' : part.ratio.replace(':', ' / ') }">
                            <template x-if="part.status === 'success'">
                              <button type="button" class="chat-zoom chat-task-image" x-data="{ dim: '', bytes: 0 }" @click="openImage(message, part)"><img :src="part.url" :alt="'Result ' + part.index" loading="lazy" @load="dim = $el.naturalWidth + '×' + $el.naturalHeight; fetch(part.url).then((response) => response.blob()).then((blob) => bytes = blob.size)"><span class="chat-task-badge num" x-show="dim" x-text="dim + (bytes ? ' · ' + $bytes(bytes) : '')"></span></button>
                            </template>
                            <template x-if="part.status !== 'success'">
                              <div class="chat-task-state">
                                <ui-icon name="triangle-alert" class="icon-lg text-danger" x-show="part.status === 'error'"></ui-icon>
                                <span class="text-strong" x-text="'Image ' + part.index + '/' + part.total"></span>
                                <span class="text-xs" :class="{ 'text-danger': part.status === 'error' }" x-text="part.status === 'error' ? part.error : part.status === 'queued' ? 'Queued' : progressLabels[part.progress] || 'Generating'"></span>
                              </div>
                            </template>
                          </div>
                          <div class="chat-task-foot row row-between">
                            <span class="text-xs text-muted num" x-text="taskMeta(part)"></span>
                            <div class="row row-xs">
                              <template x-if="part.status === 'success'">
                                <div class="row row-xs">
                                  <button type="button" class="btn btn-ghost btn-xs btn-square btn-plain tooltip" data-tip="Add to edit" aria-label="Add to edit" @click="addToEdit(part.url, 'image-' + part.index + '.png', message.image_turn)"><ui-icon name="image-plus" class="icon-sm"></ui-icon></button>
                                  <button type="button" class="btn btn-ghost btn-xs btn-square btn-plain tooltip" data-tip="Animate this image" aria-label="Animate this image" @click="animateImage(part.url, 'image-' + part.index + '.png')"><ui-icon name="video" class="icon-sm"></ui-icon></button>
                                  <a class="btn btn-ghost btn-xs btn-square btn-plain tooltip" data-tip="Download" aria-label="Download" :href="part.url" :download="'image-' + part.index + '.png'"><ui-icon name="download" class="icon-sm"></ui-icon></a>
                                </div>
                              </template>
                              <button type="button" class="btn btn-ghost btn-xs btn-square btn-plain tooltip text-danger" data-tip="Regenerate this image" aria-label="Regenerate this image" x-show="part.status === 'error' && message.image_turn" @click="retryTask(index, part, message.image_turn)"><ui-icon name="rotate-ccw" class="icon-sm"></ui-icon></button>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>

                    <div class="chat-tasks" x-show="parts(message, 'image_url').length">
                      <template x-for="(part, imageIndex) in parts(message, 'image_url')" :key="imageIndex">
                        <button type="button" class="chat-zoom chat-task" @click="lightbox(parts(message, 'image_url').map((item) => ({ src: item.image_url.url })), imageIndex)"><img class="chat-result-image" :src="part.image_url.url" alt="" loading="lazy"></button>
                      </template>
                    </div>

                    <div class="chat-tasks" x-show="parts(message, 'video_result').length">
                      <template x-for="part in parts(message, 'video_result')" :key="part.url || part.error">
                        <div class="chat-task">
                          <div class="chat-task-media" :class="{ 'chat-task-loading': !part.url && !part.error }" :style="{ aspectRatio: (part.ratio || '16:9').replace(':', ' / ') }">
                            <template x-if="part.url">
                              <video controls preload="metadata" class="chat-result-video" :src="part.url"></video>
                            </template>
                            <template x-if="part.status === 'error'">
                              <div class="chat-task-state">
                                <ui-icon name="triangle-alert" class="icon-lg text-danger"></ui-icon>
                                <span class="text-strong">Video generation failed</span>
                                <span class="text-xs text-danger" x-text="part.error"></span>
                              </div>
                            </template>
                          </div>
                          <div class="chat-task-foot row row-between" x-show="part.url">
                            <span class="text-xs text-muted num" x-text="part.model + ' · ' + (part.ratio || '16:9') + ' · ' + (part.duration || '?') + 's'"></span>
                            <a class="btn btn-ghost btn-xs btn-square btn-plain tooltip" data-tip="Download" aria-label="Download" :href="part.url" download><ui-icon name="download" class="icon-sm"></ui-icon></a>
                          </div>
                        </div>
                      </template>
                    </div>

                    <div class="markdown chat-markdown" x-show="text(message)" x-html="$md(text(message))"></div>
                  </div>
                </template>
              </div>
            </template>
            <div class="chat-msg assistant" x-show="waiting"><span class="loading loading-dots loading-sm text-muted"></span></div>
          </div>
        </div>

        <div class="chat-dock" :class="{ 'chat-dock-center': !messages.length }">
          <div class="chat-hero" x-show="!messages.length">
            <h1 class="chat-hero-title" x-text="{ chat: 'What would you like to chat about today?', image: 'Turn ideas into images', video: 'Generate videos from text or animate images', voice: 'Convert between text and voice' }[mode]"></h1>
            <p class="chat-hero-sub" x-text="{ chat: 'Ask questions, search the web, or upload images with your question', image: 'Describe the image you want, or add reference images to edit', video: 'Describe a scene to generate, or attach an image to animate it', voice: 'Synthesize natural speech, or transcribe audio into text' }[mode]"></p>
          </div>

          <div role="alert" class="alert alert-soft alert-error" x-show="error" x-cloak>
            <ui-icon name="circle-x"></ui-icon><span class="grow" x-text="error"></span>
            <button type="button" class="btn btn-ghost btn-xs btn-square" aria-label="Close" @click="error = ''"><ui-icon name="x" class="icon-sm"></ui-icon></button>
          </div>

          <div class="composer">
            <div class="vstack vstack-xs composer-refs" x-show="mode !== 'voice'">
              <div class="composer-chips">
                <label class="composer-add" aria-label="Add reference material">
                  <ui-icon name="plus"></ui-icon>
                  <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden @change="addImages($event.target.files); $event.target.value = ''">
                </label>
                <template x-for="image in images" :key="image.id">
                <div class="composer-chip">
                  <img :src="image.url" :alt="image.name">
                  <button type="button" :aria-label="'Remove ' + image.name" @click="images = images.filter((item) => item.id !== image.id)"><ui-icon name="x" class="icon-sm"></ui-icon></button>
                </div>
                </template>
              </div>
              <span class="text-xs text-muted">Reference material <span class="num" x-text="images.length"></span></span>
            </div>

            <template x-if="type === 'transcription'">
              <div class="row row-wrap composer-audio">
                <label class="btn btn-sm">
                  <ui-icon name="upload" class="icon-sm"></ui-icon>Choose audio
                  <input type="file" accept="audio/*" hidden @change="pickAudio($event)">
                </label>
                <button type="button" class="btn btn-sm" x-show="!recording" :disabled="loading" @click="startRecording()"><ui-icon name="mic" class="icon-sm"></ui-icon>Start recording</button>
                <button type="button" class="btn btn-sm btn-error btn-soft" x-show="recording" x-cloak @click="stopRecording()"><ui-icon name="circle-stop" class="icon-sm"></ui-icon>Stop recording</button>
                <span class="text-xs text-muted truncate" x-show="audio" x-text="audio && audio.name + ' · ' + $bytes(audio.size)"></span>
                <span class="tooltip tooltip-right field-help" x-show="!audio" data-tip="Supports mp3, wav, m4a, ogg, flac, webm"><ui-icon name="info" class="icon-sm"></ui-icon></span>
              </div>
            </template>

            <textarea class="composer-input" rows="4" aria-label="Prompt" :placeholder="placeholder" x-model="input" x-show="type !== 'transcription'" :maxlength="type === 'speech' ? 4000 : null"
                      @keydown.enter="!$event.shiftKey && !$event.isComposing && ($event.preventDefault(), send())"
                      @paste="paste($event)"></textarea>

            <div class="row composer-foot">
              <div class="row row-xs row-wrap grow">
                <div class="tabs tabs-box tabs-sm" role="tablist" aria-label="Creation mode">
                  <template x-for="item in modes" :key="item.value">
                    <button type="button" role="tab" class="tab" :class="{ 'tab-active': mode === item.value }" :disabled="recording" @click="setMode(item.value)"><ui-icon :name="item.icon" class="icon-sm"></ui-icon><span x-text="item.label"></span></button>
                  </template>
                </div>


                <template x-if="mode === 'chat'">
                  <div class="row row-xs row-wrap">
                    <ui-select variant="ghost" icon="openai" aria-label="Model" x-model="model">
                      <template x-for="item in models" :key="item"><option :value="item" x-text="item"></option></template>
                    </ui-select>
                    <ui-select variant="ghost" aria-label="Thinking effort" placeholder="Default thinking" x-model="effort">
                      <template x-for="[value, label] in efforts" :key="value"><option :value="value" x-text="label"></option></template>
                    </ui-select>
                    <button type="button" class="btn btn-xs" :class="webSearch ? 'btn-primary' : 'btn-ghost'" :aria-pressed="webSearch" :disabled="loading" @click="webSearch = !webSearch"><ui-icon name="globe" class="icon-sm"></ui-icon>Web search</button>
                  </div>
                </template>

                <template x-if="mode === 'image'">
                  <div class="row row-xs row-wrap">
                    <ui-select variant="ghost" icon="openai" aria-label="Model" x-model="model">
                      <template x-for="item in imageModels" :key="item"><option :value="item" x-text="item"></option></template>
                    </ui-select>
                    <div class="chat-pop-wrap" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
                      <button type="button" class="btn btn-ghost btn-xs" :aria-expanded="open" @click="open = !open"><ui-icon name="sliders-horizontal" class="icon-sm"></ui-icon><span x-text="settingsLabel"></span></button>
                      <div class="chat-pop vstack" x-show="open" x-cloak x-transition.opacity>
                        <div class="chat-pop-row">
                          <span class="field-label">Count</span>
                          <div class="tabs tabs-box tabs-sm" role="tablist">
                            <template x-for="count in 8" :key="count">
                              <button type="button" role="tab" class="tab" :class="{ 'tab-active': settings.count === count }" x-text="count" @click="settings.count = count"></button>
                            </template>
                          </div>
                        </div>
                        <div class="vstack vstack-sm">
                          <span class="field-label">Aspect ratio</span>
                          <div class="chat-options">
                            <template x-for="item in ratios" :key="item[0]">
                              <button type="button" class="btn btn-ghost chat-ratio" :class="{ 'chat-ratio-active': settings.ratio === item[0] }" @click="setRatio(item[0])">
                                <span class="chat-ratio-box">
                                  <ui-icon name="image" class="icon-sm" x-show="item[0] === 'auto'"></ui-icon>
                                  <span class="chat-ratio-shape" x-show="item[0] !== 'auto'" :style="{ aspectRatio: item[1] + '/' + item[2], [item[1] >= item[2] ? 'width' : 'height']: '100%' }"></span>
                                </span>
                                <span x-text="item[0]"></span>
                              </button>
                            </template>
                          </div>
                        </div>
                      </div>
                    </div>
                    <span class="row row-xs text-xs text-muted tooltip" data-tip="Remaining image quota across available accounts" x-show="$store.app.admin"><ui-icon name="coins" class="icon-sm"></ui-icon>Remaining <span class="num" x-text="quota === null ? '—' : $num(quota)"></span></span>
                  </div>
                </template>

                <template x-if="mode === 'video'">
                  <div class="row row-xs row-wrap">
                    <ui-select variant="ghost" icon="video" aria-label="Model" x-model="model">
                      <option value="veo_3_1">Veo 3.1</option>
                      <option value="omni_flash">Omni Flash</option>
                    </ui-select>
                    <div class="chat-pop-wrap" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
                      <button type="button" class="btn btn-ghost btn-xs" :aria-expanded="open" @click="open = !open"><ui-icon name="sliders-horizontal" class="icon-sm"></ui-icon><span x-text="videoSettings.ratio + ' · ' + videoSettings.duration + 's'"></span></button>
                      <div class="chat-pop vstack" x-show="open" x-cloak x-transition.opacity>
                        <div class="vstack vstack-sm">
                          <span class="field-label">Aspect ratio</span>
                          <div class="chat-options">
                            <template x-for="item in [['16:9','16','9'],['9:16','9','16'],['1:1','1','1']]" :key="item[0]">
                              <button type="button" class="btn btn-ghost chat-ratio" :class="{ 'chat-ratio-active': videoSettings.ratio === item[0] }" @click="videoSettings.ratio = item[0]">
                                <span class="chat-ratio-box"><span class="chat-ratio-shape" :style="{ aspectRatio: item[1] + '/' + item[2], [item[1] >= item[2] ? 'width' : 'height']: '100%' }"></span></span>
                                <span x-text="item[0]"></span>
                              </button>
                            </template>
                          </div>
                        </div>
                        <div class="chat-pop-row">
                          <span class="field-label">Duration</span>
                          <div class="tabs tabs-box tabs-sm" role="tablist">
                            <template x-for="d in [5,8,10]" :key="d">
                              <button type="button" role="tab" class="tab" :class="{ 'tab-active': videoSettings.duration === d }" x-text="d + 's'" @click="videoSettings.duration = d"></button>
                            </template>
                          </div>
                        </div>
                      </div>
                    </div>
                    <span class="text-xs text-muted" x-show="images.length"><ui-icon name="image" class="icon-sm"></ui-icon>Animating reference image</span>
                  </div>
                </template>

                <template x-if="mode === 'voice'">
                  <div class="row row-xs row-wrap">
                    <div class="tabs tabs-box tabs-sm" role="tablist" aria-label="Voice type">
                      <button type="button" role="tab" class="tab" :class="{ 'tab-active': type === 'speech' }" :disabled="recording" @click="setType('speech')">Synthesize</button>
                      <button type="button" role="tab" class="tab" :class="{ 'tab-active': type === 'transcription' }" :disabled="recording" @click="setType('transcription')">Transcribe</button>
                    </div>
                    <ui-select variant="ghost" aria-label="Voice" x-model="voice" x-show="type === 'speech'">
                      <template x-for="[value, label] in voices" :key="value"><option :value="value" x-text="label"></option></template>
                    </ui-select>
                    <ui-select variant="ghost" aria-label="Format" x-model="format" x-show="type === 'speech'">
                      <template x-for="[value, label] in formats" :key="value"><option :value="value" x-text="label"></option></template>
                    </ui-select>
                  </div>
                </template>
              </div>
              <button type="button" class="btn btn-primary btn-sm btn-circle" aria-label="Submit" :disabled="!canSend" @click="send()">
                <span class="loading loading-spinner loading-xs" x-show="loading"></span>
                <ui-icon name="arrow-up" x-show="!loading"></ui-icon>
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </template>

  <template id="page-accounts">
    <div class="page" x-data="accounts">
      <div class="page-head">
        <h1 class="title-page">Account Pool</h1>
        <div class="row" x-show="tab === 'accounts'">
          <button type="button" class="btn btn-sm" @click="loadModels()"><ui-icon name="list-tree" class="icon-sm"></ui-icon>Available models</button>
          <button type="button" class="btn btn-sm" :disabled="busy === 'quota' || !summary?.total" @click="queryAll()"><ui-icon name="coins" class="icon-sm" x-show="busy !== 'quota'"></ui-icon><span class="loading loading-spinner loading-xs" x-show="busy === 'quota'"></span>Query all quotas</button>
          <button type="button" class="btn btn-sm" :disabled="loading" @click="loadAccounts()"><ui-icon name="refresh-cw" class="icon-sm" :class="{ spin: loading }"></ui-icon>Refresh</button>
          <button type="button" class="btn btn-sm btn-primary" @click="openImport()"><ui-icon name="upload" class="icon-sm"></ui-icon>Import</button>
        </div>
        <div class="row" x-show="tab !== 'accounts'" x-cloak>
          <button type="button" class="btn btn-sm btn-primary" @click="openSourceForm()"><ui-icon name="plus" class="icon-sm"></ui-icon>Add connection</button>
        </div>
      </div>

      <div class="vstack vstack-lg">
        <div class="tabs tabs-border" role="tablist">
          <button type="button" role="tab" class="tab" :class="{ 'tab-active': tab === 'accounts' }" @click="tab = 'accounts'">Accounts</button>
          <button type="button" role="tab" class="tab" :class="{ 'tab-active': tab === 'cpa' }" @click="tab = 'cpa'">CPA</button>
          <button type="button" role="tab" class="tab" :class="{ 'tab-active': tab === 'sub2api' }" @click="tab = 'sub2api'">Sub2API</button>
        </div>

        <!-- Accounts -->
        <template x-if="tab === 'accounts'">
          <div class="vstack vstack-lg">
            <template x-if="!summary">
              <div class="grid grid-4"><template x-for="i in 4"><div class="skeleton metric-skeleton"></div></template></div>
            </template>
            <template x-if="summary">
              <div class="grid grid-4">
                <template x-for="metric in metrics" :key="metric.label">
                  <div class="metric-tile">
                    <div class="metric-label"><span x-text="metric.label"></span><ui-icon :name="metric.icon" class="icon-sm"></ui-icon></div>
                    <div class="metric-value" x-text="$num(metric.value)"></div>
                    <div class="metric-meta" x-text="metric.meta"></div>
                  </div>
                </template>
              </div>
            </template>

            <section class="panel panel-flush">
              <div class="panel-head row-wrap">
                <div class="row row-wrap">
                  <label class="input input-sm search-input">
                    <ui-icon name="search" class="icon-sm text-subtle"></ui-icon>
                    <input type="search" placeholder="Search email" x-model.debounce.400ms="query">
                  </label>
                  <ui-select x-model="type">
                    <option value="">All types</option>
                    <template x-for="item in types" :key="item"><option :value="item" x-text="item"></option></template>
                  </ui-select>
                  <ui-select x-model="status">
                    <option value="">All statuses</option>
                    <template x-for="item in Object.keys(statuses)" :key="item"><option :value="item" x-text="item"></option></template>
                  </ui-select>
                </div>
                <div class="row" x-show="selected.length">
                  <span class="text-muted num">Selected <span x-text="selected.length"></span></span>
                  <button type="button" class="btn btn-sm btn-ghost" @click="selected = []">Clear selection</button>
                  <button type="button" class="btn btn-sm btn-error btn-soft" :disabled="busy === 'delete'" @click="remove(selected, `Delete ${selected.length} selected accounts`)"><ui-icon name="trash-2" class="icon-sm"></ui-icon>Delete selected</button>
                </div>
                <button type="button" class="btn btn-sm btn-error btn-soft tooltip tooltip-left" data-tip="Delete accounts with abnormal status on the current page" x-show="!selected.length" :disabled="!abnormal.length || busy === 'delete'" @click="remove(abnormal.map((item) => item.access_token), `Remove ${abnormal.length} abnormal accounts on the current page`)"><ui-icon name="trash-2" class="icon-sm"></ui-icon>Remove abnormal accounts</button>
              </div>
              <div class="table-wrap">
                <table class="table table-sm">
                  <thead>
                    <tr>
                      <th class="col-check"><input type="checkbox" class="checkbox checkbox-sm" aria-label="Select all on this page" :checked="allSelected" @change="selected = $event.target.checked ? items.map((item) => item.access_token) : []"></th>
                      <th>Email</th><th class="text-center">Type</th><th class="text-center">Route</th><th class="text-center">Status</th><th class="text-center">Quota</th>
                      <th class="text-center"><span class="row row-xs row-center">Calls<span class="tooltip tooltip-bottom field-help" data-tip="In progress / Succeeded / Failed; if in-progress stays above 0 while idle, some tasks did not end properly"><ui-icon name="info" class="icon-sm"></ui-icon></span></span></th>
                      <th class="text-center">Created</th>
                      <th class="col-actions">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="item in items" :key="item.access_token">
                      <tr>
                        <td class="col-check"><input type="checkbox" class="checkbox checkbox-sm" aria-label="Select" :value="item.access_token" x-model="selected"></td>
                        <td class="text-strong" x-text="item.email || '—'"></td>
                        <td class="text-center"><span class="badge badge-sm badge-soft badge-info" x-text="item.type"></span></td>
                        <td class="text-center"><span class="row row-xs row-center"><span class="badge badge-sm badge-soft" x-show="item.is_codex">Codex</span><span class="badge badge-sm badge-soft">Web</span></span></td>
                        <td class="text-center"><span class="badge badge-sm badge-soft" :class="statuses[item.status]" x-text="item.status"></span></td>
                        <td class="text-center nowrap"><span class="num" x-text="$num(Math.max(0, item.remaining))"></span> <span class="text-xs text-muted tooltip" :data-tip="$time(item.reset_after)" x-text="resetText(item.reset_after)"></span></td>
                        <td class="text-center num nowrap"><span :class="item.image_inflight ? 'text-warning text-strong' : 'text-subtle'" x-text="item.image_inflight"></span> / <span x-text="$num(item.success)"></span> / <span x-text="$num(item.fail)"></span></td>
                        <td class="text-center num text-muted nowrap" x-text="$time(item.created_at)"></td>
                        <td class="col-actions">
                          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="Details" aria-label="Details" @click="detail = item; detailTab = 'info'"><ui-icon name="eye" class="icon-sm"></ui-icon></button>
                          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="Refresh quota" aria-label="Refresh quota" :disabled="busy === 'quota' || busy === item.access_token" @click="refreshQuota(item)"><ui-icon name="refresh-cw" class="icon-sm" :class="{ spin: busy === item.access_token }"></ui-icon></button>
                          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="Edit" aria-label="Edit" @click="openEdit(item)"><ui-icon name="pencil" class="icon-sm"></ui-icon></button>
                          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip text-danger" data-tip="Delete" aria-label="Delete" @click="remove([item.access_token], 'Delete this account')"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <div class="center-fill" x-show="loading && !items.length"><span class="loading loading-spinner loading-sm"></span></div>
              <div class="empty" x-show="!loading && !items.length"><ui-icon name="users-round"></ui-icon><span x-text="query || type || status ? 'No matching accounts' : 'No accounts in the pool yet'"></span></div>
              <ui-pager x-show="total > 10" :page="page" :size="size" :total="total" @change="page = $event.detail.page; size = $event.detail.size; loadAccounts()"></ui-pager>
            </section>
          </div>
        </template>

        <!-- CPA / Sub2API connections -->
        <template x-if="tab !== 'accounts'">
          <section class="panel panel-flush">
            <div class="table-wrap">
              <table class="table table-sm">
                <thead>
                  <tr>
                    <th>Connection</th>
                    <template x-if="tab === 'sub2api'"><th>Login method</th></template>
                    <template x-if="tab === 'sub2api'"><th>Group</th></template>
                    <th>Recent import</th><th class="col-actions">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="item in sources ?? []" :key="item.id">
                    <tr>
                      <td>
                        <div class="text-strong" x-text="item.name || item.base_url"></div>
                        <div class="text-xs text-muted" x-text="item.base_url"></div>
                      </td>
                      <template x-if="tab === 'sub2api'"><td x-text="item.email || (item.has_api_key ? 'API Key' : '—')"></td></template>
                      <template x-if="tab === 'sub2api'"><td x-text="item.group_id || 'All groups'"></td></template>
                      <td>
                        <span class="text-subtle" x-show="!item.import_job">—</span>
                        <template x-if="item.import_job">
                          <div class="vstack vstack-xs">
                            <div class="row">
                              <span class="badge badge-sm badge-soft" :class="jobStatus[item.import_job.status][1]" x-text="jobStatus[item.import_job.status][0]"></span>
                              <span class="num text-muted" x-text="`${item.import_job.completed} / ${item.import_job.total}`"></span>
                              <span class="text-xs text-subtle num" x-text="$short(item.import_job.created_at)"></span>
                            </div>
                            <progress class="progress" :class="item.import_job.status === 'failed' ? 'progress-error' : 'progress-neutral'" :value="progress(item.import_job)" max="100"></progress>
                            <div class="text-xs text-muted num" x-text="`Added ${item.import_job.added} · Skipped ${item.import_job.skipped} · Refreshed ${item.import_job.refreshed} · Failed ${item.import_job.failed}`"></div>
                            <div class="text-xs text-danger break-all" x-show="item.import_job.errors.length" x-text="item.import_job.errors[0]?.error"></div>
                          </div>
                        </template>
                      </td>
                      <td class="col-actions">
                        <button type="button" class="btn btn-ghost btn-sm" :disabled="syncing === item.id" @click="browse(item)"><span class="loading loading-spinner loading-xs" x-show="syncing === item.id"></span><ui-icon name="download" class="icon-sm" x-show="syncing !== item.id"></ui-icon>Choose to import</button>
                        <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="Edit" aria-label="Edit" @click="openSourceForm(item)"><ui-icon name="pencil" class="icon-sm"></ui-icon></button>
                        <button type="button" class="btn btn-ghost btn-sm btn-square tooltip text-danger" data-tip="Delete" aria-label="Delete" @click="removeSource(item)"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="center-fill" x-show="!sources"><span class="loading loading-spinner loading-sm"></span></div>
            <div class="empty" x-show="sources && !sources.length"><ui-icon name="server-cog"></ui-icon><span x-text="tab === 'cpa' ? 'No CPA connections yet' : 'No Sub2API connections yet'"></span></div>
          </section>
        </template>
      </div>

      <!-- Available models -->
      <dialog class="modal" x-effect="models.open ? $el.showModal() : $el.close()" @close="models.open = false">
        <div class="modal-box">
          <div class="row row-between modal-title">
            <span>Available models</span>
            <button type="button" class="btn btn-ghost btn-sm btn-square tooltip tooltip-left" data-tip="Fetch again" aria-label="Fetch again" :disabled="models.loading" @click="loadModels(true)"><ui-icon name="refresh-cw" class="icon-sm" :class="{ spin: models.loading }"></ui-icon></button>
          </div>
          <div class="center-fill" x-show="models.loading && !models.items.length"><span class="loading loading-spinner loading-sm"></span></div>
          <div class="empty" x-show="!models.loading && !models.items.length"><ui-icon name="list-tree"></ui-icon>No available models</div>
          <div class="row row-wrap" x-show="models.items.length">
            <template x-for="model in models.items" :key="model.id">
              <ui-model :name="model.id"></ui-model>
            </template>
          </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>Close</button></form>
      </dialog>

      <!-- Account details -->
      <dialog class="modal" x-effect="detail ? $el.showModal() : $el.close()" @close="detail = null">
        <div class="modal-box modal-wide">
          <template x-if="detail">
            <div class="vstack">
              <div class="modal-head">
                <h3 class="modal-title truncate" x-text="detail.email || 'Account details'"></h3>
                <div class="tabs tabs-box tabs-sm" role="tablist">
                  <button type="button" role="tab" class="tab" :class="{ 'tab-active': detailTab === 'info' }" @click="detailTab = 'info'">Overview</button>
                  <button type="button" role="tab" class="tab" :class="{ 'tab-active': detailTab === 'token' }" @click="detailTab = 'token'">Credentials</button>
                </div>
                <button type="button" class="btn btn-ghost btn-sm btn-square" aria-label="Close" @click="detail = null"><ui-icon name="x" class="icon-sm"></ui-icon></button>
              </div>
              <dl class="kv" x-show="detailTab === 'info'">
                <dt>User ID</dt><dd><span class="mono copyable" x-show="detail.user_id" x-text="detail.user_id" @click="$copy(detail.user_id)"></span><span x-show="!detail.user_id">—</span></dd>
                <dt>Account ID</dt><dd><span class="mono copyable" x-show="detail.account_id" x-text="detail.account_id" @click="$copy(detail.account_id)"></span><span x-show="!detail.account_id">—</span></dd>
                <dt>Type</dt><dd><span class="badge badge-sm badge-soft badge-info" x-text="detail.type"></span></dd>
                <dt>Route</dt><dd class="row row-xs"><span class="badge badge-sm badge-soft" x-show="detail.is_codex">Codex</span><span class="badge badge-sm badge-soft">Web</span></dd>
                <dt>Status</dt><dd><span class="badge badge-sm badge-soft" :class="statuses[detail.status]" x-text="detail.status"></span></dd>
                <dt>Account proxy</dt><dd x-text="detail.proxy || 'Use global proxy'"></dd>
                <dt>Quota</dt><dd class="num" x-text="`Remaining ${Math.max(0, detail.remaining)} / Total ${Math.max(0, detail.quota)}`"></dd>
                <dt>Calls</dt><dd class="num" x-text="`Succeeded ${detail.success} · Failed ${detail.fail} · In progress ${detail.image_inflight}`"></dd>
                <dt>Reset time</dt><dd class="num" x-text="$time(detail.reset_after)"></dd>
                <dt>Last used</dt><dd class="num" x-text="$time(detail.last_used_at)"></dd>
                <dt>Last refreshed</dt><dd class="num" x-text="$time(detail.last_refresh_at)"></dd>
                <dt>Created</dt><dd class="num" x-text="$time(detail.created_at)"></dd>
                <dt>Last error</dt><dd :class="{ 'text-danger': detail.last_error }" x-text="detail.last_error || '—'"></dd>
              </dl>
              <dl class="kv" x-show="detailTab === 'token'">
                <dt>Access Token</dt><dd><span class="mono copyable" title="Click to copy" x-text="mask(detail.access_token)" @click="$copy(detail.access_token)"></span></dd>
                <dt>Refresh Token</dt><dd><span x-show="detail.has_refresh_token" class="text-subtle">•••••• (hidden for security)</span><span x-show="!detail.has_refresh_token">—</span></dd>
                <dt>ID Token</dt><dd><span x-show="detail.has_id_token" class="text-subtle">•••••• (hidden for security)</span><span x-show="!detail.has_id_token">—</span></dd>
              </dl>
            </div>
          </template>
        </div>
        <form method="dialog" class="modal-backdrop"><button>Close</button></form>
      </dialog>

      <!-- Edit account -->
      <dialog class="modal" x-effect="edit.open ? $el.showModal() : $el.close()" @close="edit.open = false">
        <form class="modal-box vstack" @submit.prevent="saveEdit()">
          <h3 class="modal-title">Edit account</h3>
          <div class="field">
            <span class="field-label">Status</span>
            <ui-select class="block" x-model="edit.status">
              <template x-for="item in Object.keys(statuses)" :key="item"><option :value="item" x-text="item"></option></template>
            </ui-select>
          </div>
          <div class="field">
            <label class="field-label" for="account-proxy">Account proxy<span class="tooltip field-help" data-tip="Uses the global proxy when left empty"><ui-icon name="info" class="icon-sm"></ui-icon></span></label>
            <div class="input-group">
              <input id="account-proxy" class="input input-sm mono" x-model="edit.proxy" placeholder="http://127.0.0.1:7890">
              <button type="button" class="btn btn-sm" :disabled="!edit.proxy || edit.testing" @click="testProxy()"><span class="loading loading-spinner loading-xs" x-show="edit.testing"></span><ui-icon name="plug-zap" class="icon-sm" x-show="!edit.testing"></ui-icon>Test</button>
            </div>
          </div>
          <div class="modal-action">
            <button type="button" class="btn btn-sm" @click="edit.open = false">Cancel</button>
            <button type="submit" class="btn btn-sm btn-primary" :disabled="edit.saving"><span class="loading loading-spinner loading-xs" x-show="edit.saving"></span>Save</button>
          </div>
        </form>
        <form method="dialog" class="modal-backdrop"><button>Close</button></form>
      </dialog>

      <!-- Import accounts -->
      <dialog class="modal" x-effect="imp.open ? $el.showModal() : $el.close()" @close="imp.open = false">
        <div class="modal-box vstack">
          <div class="row modal-title">
            <button type="button" class="btn btn-ghost btn-sm btn-square" aria-label="Back to import method" x-show="imp.method !== 'menu'" @click="imp.method = 'menu'"><ui-icon name="arrow-left" class="icon-sm"></ui-icon></button>
            <span x-text="importTitle"></span>
          </div>

          <div class="vstack vstack-sm" x-show="imp.method === 'menu'">
            <template x-for="option in [
              { method: 'oauth', icon: 'log-in', title: 'Sign in to an existing account', text: 'Sign in to a ChatGPT account in the browser; auto-renews after import' },
              { method: 'token', icon: 'key-round', title: 'Access Token', text: 'Paste or read from a TXT file, one per line' },
              { method: 'session', icon: 'file-json', title: 'Session JSON', text: 'Copy the full login info from chatgpt.com' },
              { method: 'codex', icon: 'file-json', title: 'Codex auth JSON', text: 'Marked as a Codex account after import' },
              { method: 'files', icon: 'files', title: 'Account JSON files', text: 'Supports a single account, account arrays, and CPA files; multi-select allowed' },
              { method: 'cpa', icon: 'cloud', title: 'Import from CPA', text: 'Choose accounts from a connected CPA service' },
              { method: 'sub2api', icon: 'server-cog', title: 'Import from Sub2API', text: 'Choose accounts from a connected Sub2API service' },
            ]" :key="option.method">
              <button type="button" class="option-card" @click="['cpa', 'sub2api'].includes(option.method) ? gotoSource(option.method) : imp.method = option.method">
                <ui-icon :name="option.icon"></ui-icon>
                <span class="vstack vstack-xs grow">
                  <span class="text-strong" x-text="option.title"></span>
                  <span class="text-xs text-muted" x-text="option.text"></span>
                </span>
                <ui-icon name="chevron-right" class="icon-sm text-subtle"></ui-icon>
              </button>
            </template>
          </div>

          <template x-if="imp.method === 'oauth'">
            <div class="vstack">
              <div class="field">
                <label class="field-label" for="oauth-email">Email<span class="tooltip field-help" data-tip="Optional; prefilled on the login page"><ui-icon name="info" class="icon-sm"></ui-icon></span></label>
                <input id="oauth-email" type="email" class="input input-sm" x-model="imp.email" placeholder="you@example.com" :disabled="imp.oauth || imp.starting">
              </div>
              <button type="button" class="btn btn-sm btn-primary" x-show="!imp.oauth" :disabled="imp.starting" @click="startOAuth()"><span class="loading loading-spinner loading-xs" x-show="imp.starting"></span><ui-icon name="external-link" class="icon-sm" x-show="!imp.starting"></ui-icon>Open authorization page</button>
              <template x-if="imp.oauth">
                <div class="vstack">
                  <div class="field">
                    <span class="field-label">Authorization URL</span>
                    <span class="mono copyable break-all" title="Click to copy" x-text="imp.oauth.authorize_url" @click="$copy(imp.oauth.authorize_url)"></span>
                    <div class="row">
                      <a class="btn btn-sm" :href="imp.oauth.authorize_url" target="_blank" rel="noreferrer"><ui-icon name="external-link" class="icon-sm"></ui-icon>Open again</a>
                      <button type="button" class="btn btn-sm" @click="imp.oauth = null; imp.callback = ''"><ui-icon name="rotate-ccw" class="icon-sm"></ui-icon>Regenerate</button>
                    </div>
                  </div>
                  <div class="field">
                    <label class="field-label" for="oauth-callback">Callback URL<span class="tooltip field-help" data-tip="After signing in, the browser redirects to platform.openai.com/auth/callback?code=…; copy the full address from the address bar, or paste just the code"><ui-icon name="info" class="icon-sm"></ui-icon></span></label>
                    <textarea id="oauth-callback" class="textarea textarea-sm mono" rows="3" x-model="imp.callback" placeholder="https://platform.openai.com/auth/callback?code=...&state=..."></textarea>
                  </div>
                </div>
              </template>
              <div role="alert" class="alert alert-soft alert-warning">
                <ui-icon name="triangle-alert"></ui-icon><span>The authorization code can only be used once and must be completed within 10 minutes. If the callback page shows an error, regenerate it and sign in again.</span>
              </div>
            </div>
          </template>

          <template x-if="imp.method === 'token'">
            <div class="field">
              <div class="row row-between">
                <label class="field-label" for="import-tokens">Access Token<span class="text-subtle num" x-text="`Detected ${tokenList.length}`"></span></label>
                <button type="button" class="btn btn-ghost btn-xs" @click="$refs.txt.click()"><ui-icon name="file-text" class="icon-sm"></ui-icon>Read TXT</button>
              </div>
              <textarea id="import-tokens" class="textarea textarea-sm mono" rows="10" x-model="imp.tokens" placeholder="One Access Token per line"></textarea>
              <input type="file" accept=".txt,text/plain" hidden x-ref="txt" @change="readTxt($event)">
            </div>
          </template>

          <template x-if="imp.method === 'session'">
            <div class="vstack">
              <div role="alert" class="alert alert-soft alert-warning">
                <ui-icon name="triangle-alert"></ui-icon><span>Please import with a secondary account you rarely use, to avoid getting your main account banned.</span>
              </div>
              <div class="field">
                <div class="row row-between">
                  <label class="field-label" for="import-session">Session JSON</label>
                  <a class="btn btn-ghost btn-xs" href="https://chatgpt.com/api/auth/session" target="_blank" rel="noreferrer">Open page<ui-icon name="external-link" class="icon-sm"></ui-icon></a>
                </div>
                <textarea id="import-session" class="textarea textarea-sm mono" rows="10" x-model="imp.session" placeholder='Paste the full content returned by the page; it must include "accessToken"'></textarea>
              </div>
            </div>
          </template>

          <template x-if="imp.method === 'codex'">
            <div class="field">
              <label class="field-label" for="import-codex">Codex auth JSON</label>
              <textarea id="import-codex" class="textarea textarea-sm mono" rows="12" x-model="imp.codex" placeholder='Content that includes "access_token", "refresh_token", "id_token"'></textarea>
            </div>
          </template>

          <template x-if="imp.method === 'files'">
            <div class="empty">
              <ui-icon name="files"></ui-icon>
              <span>Choose one or more account JSON files; the count will be confirmed before importing</span>
              <button type="button" class="btn btn-sm btn-primary" :disabled="imp.submitting" @click="$refs.json.click()"><span class="loading loading-spinner loading-xs" x-show="imp.submitting"></span>Choose files</button>
              <input type="file" accept=".json,application/json" multiple hidden x-ref="json" @change="readJsonFiles($event)">
            </div>
          </template>

          <div class="modal-action" x-show="['oauth', 'token', 'session', 'codex'].includes(imp.method)">
            <button type="button" class="btn btn-sm" @click="imp.open = false">Cancel</button>
            <button type="button" class="btn btn-sm btn-primary" :disabled="imp.submitting || (imp.method === 'oauth' ? !imp.callback : imp.method === 'token' ? !tokenList.length : !imp[imp.method])" @click="importTyped()"><span class="loading loading-spinner loading-xs" x-show="imp.submitting"></span>Import</button>
          </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>Close</button></form>
      </dialog>

      <!-- CPA connection -->
      <dialog class="modal" x-effect="poolForm.open ? $el.showModal() : $el.close()" @close="poolForm.open = false">
        <form class="modal-box vstack" @submit.prevent="savePool()">
          <h3 class="modal-title" x-text="poolForm.id ? 'Edit CPA connection' : 'Add CPA connection'"></h3>
          <div class="field">
            <label class="field-label" for="pool-name">Name</label>
            <input id="pool-name" class="input input-sm" x-model="poolForm.name" placeholder="Optional, e.g. Main pool">
          </div>
          <div class="field">
            <label class="field-label" for="pool-url">Service URL</label>
            <input id="pool-url" class="input input-sm mono" x-model="poolForm.base_url" placeholder="http://your-cpa-host:8317">
          </div>
          <div class="field">
            <label class="field-label" for="pool-secret">Admin key</label>
            <label class="input input-sm">
              <input id="pool-secret" class="grow mono" :type="poolForm.show ? 'text' : 'password'" x-model="poolForm.secret" :placeholder="poolForm.id ? 'Leave empty to keep unchanged' : 'CPA admin key'">
              <button type="button" class="btn btn-ghost btn-xs btn-square" :aria-label="poolForm.show ? 'Hide' : 'Show'" @click="poolForm.show = !poolForm.show"><ui-icon :name="poolForm.show ? 'eye-off' : 'eye'" class="icon-sm"></ui-icon></button>
            </label>
          </div>
          <div class="modal-action">
            <button type="button" class="btn btn-sm" @click="poolForm.open = false">Cancel</button>
            <button type="submit" class="btn btn-sm btn-primary" :disabled="!poolForm.base_url || (!poolForm.id && !poolForm.secret) || poolForm.saving"><span class="loading loading-spinner loading-xs" x-show="poolForm.saving"></span>Save</button>
          </div>
        </form>
        <form method="dialog" class="modal-backdrop"><button>Close</button></form>
      </dialog>

      <!-- Sub2API connection -->
      <dialog class="modal" x-effect="serverForm.open ? $el.showModal() : $el.close()" @close="serverForm.open = false">
        <form class="modal-box vstack" @submit.prevent="saveServer()">
          <h3 class="modal-title" x-text="serverForm.id ? 'Edit Sub2API connection' : 'Add Sub2API connection'"></h3>
          <template x-if="serverForm.open">
            <div class="vstack">
              <div class="field">
                <label class="field-label" for="server-name">Name</label>
                <input id="server-name" class="input input-sm" x-model="serverForm.name" placeholder="Optional, e.g. Self-hosted service">
              </div>
              <div class="field">
                <label class="field-label" for="server-url">Service URL</label>
                <input id="server-url" class="input input-sm mono" x-model="serverForm.base_url" placeholder="http://your-sub2api-host:8080">
              </div>
              <div class="field">
                <span class="field-label">Login method</span>
                <ui-select class="block" x-model="serverForm.auth">
                  <option value="password">Admin email and password</option>
                  <option value="api_key">Admin API Key</option>
                </ui-select>
              </div>
              <template x-if="serverForm.auth === 'password'">
                <div class="field">
                  <label class="field-label" for="server-email">Admin email</label>
                  <input id="server-email" type="email" class="input input-sm" x-model="serverForm.email" placeholder="admin@example.com">
                </div>
              </template>
              <div class="field">
                <label class="field-label" for="server-secret" x-text="serverForm.auth === 'password' ? 'Admin password' : 'Admin API Key'"></label>
                <label class="input input-sm">
                  <input id="server-secret" class="grow mono" :type="serverForm.show ? 'text' : 'password'" x-model="serverForm[serverForm.auth]" :placeholder="serverForm.id ? 'Leave empty to keep unchanged' : ''">
                  <button type="button" class="btn btn-ghost btn-xs btn-square" :aria-label="serverForm.show ? 'Hide' : 'Show'" @click="serverForm.show = !serverForm.show"><ui-icon :name="serverForm.show ? 'eye-off' : 'eye'" class="icon-sm"></ui-icon></button>
                </label>
              </div>
              <div class="field">
                <div class="row row-between">
                  <label class="field-label" for="server-group">Group<span class="tooltip field-help" data-tip="Only sync OpenAI accounts in this group; leave empty to sync all, ungrouped means no group. You can load the group list after saving the connection"><ui-icon name="info" class="icon-sm"></ui-icon></span></label>
                  <button type="button" class="btn btn-ghost btn-xs" x-show="serverForm.id" :disabled="serverForm.loadingGroups" @click="loadGroups()"><ui-icon name="refresh-cw" class="icon-sm" :class="{ spin: serverForm.loadingGroups }"></ui-icon>Load groups</button>
                </div>
                <input id="server-group" class="input input-sm mono" x-show="!serverForm.groups" x-model="serverForm.group_id" placeholder="Leave empty to sync all groups">
                <template x-if="serverForm.groups">
                  <ui-select class="block" x-model="serverForm.group_id">
                    <option value="">All groups</option>
                    <option value="ungrouped">Ungrouped</option>
                    <template x-for="group in serverForm.groups" :key="group.id"><option :value="group.id" x-text="groupLabel(group)"></option></template>
                  </ui-select>
                </template>
              </div>
            </div>
          </template>
          <div class="modal-action">
            <button type="button" class="btn btn-sm" @click="serverForm.open = false">Cancel</button>
            <button type="submit" class="btn btn-sm btn-primary" :disabled="serverForm.saving || !serverForm.base_url || (serverForm.auth === 'password' ? !serverForm.email || (!serverForm.id && !serverForm.password) : !serverForm.id && !serverForm.api_key)"><span class="loading loading-spinner loading-xs" x-show="serverForm.saving"></span>Save</button>
          </div>
        </form>
        <form method="dialog" class="modal-backdrop"><button>Close</button></form>
      </dialog>

      <!-- Select remote accounts -->
      <dialog class="modal" x-effect="browser.open ? $el.showModal() : $el.close()" @close="browser.open = false">
        <div class="modal-box modal-wide vstack">
          <div class="modal-title">
            <div>Select accounts to import</div>
            <div class="text-xs text-muted" x-text="browser.source && (browser.source.name || browser.source.base_url)"></div>
          </div>
          <div class="row row-between row-wrap">
            <label class="input input-sm search-input">
              <ui-icon name="search" class="icon-sm text-subtle"></ui-icon>
              <input type="search" :placeholder="browser.kind === 'cpa' ? 'Search email or file name' : 'Search email, name, or plan'" x-model="browser.query" @input.debounce.300ms="browser.page = 1; reloadBrowser()">
            </label>
            <span class="text-muted num" x-text="`${browserTotal} total · ${browser.selected.length} selected`"></span>
          </div>
          <div class="table-wrap">
            <table class="table table-sm">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" class="checkbox checkbox-sm" aria-label="Select all on this page" :checked="browserAll" @change="toggleBrowserAll()"></th>
                  <th>Account</th>
                  <template x-if="browser.kind === 'sub2api'"><th>Plan</th></template>
                  <template x-if="browser.kind === 'sub2api'"><th>Status</th></template>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in browserPage" :key="row.key">
                  <tr>
                    <td class="col-check"><input type="checkbox" class="checkbox checkbox-sm" aria-label="Select" :value="row.key" x-model="browser.selected"></td>
                    <td>
                      <div class="text-strong" x-text="row.title"></div>
                      <div class="text-xs text-muted break-all" x-text="row.meta"></div>
                    </td>
                    <template x-if="browser.kind === 'sub2api'"><td><span class="badge badge-sm badge-soft" x-show="row.plan" x-text="row.plan"></span></td></template>
                    <template x-if="browser.kind === 'sub2api'"><td><span class="badge badge-sm badge-soft" :class="{ 'badge-success': row.status === 'active' }" x-show="row.status" x-text="row.status"></span></td></template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="empty" x-show="!browserRows.length"><ui-icon name="search"></ui-icon><span x-text="browser.query ? 'No matching accounts' : 'No accounts available to import from the remote service'"></span></div>
          <ui-pager x-show="browserTotal > 20" :page="browser.page" :size="browser.size" :total="browserTotal" sizes="20,50,100,200" @change="browser.page = $event.detail.page; browser.size = $event.detail.size; reloadBrowser()"></ui-pager>
          <div class="modal-action">
            <button type="button" class="btn btn-sm" @click="browser.open = false">Cancel</button>
            <button type="button" class="btn btn-sm" x-show="browser.kind === 'sub2api'" :disabled="!browserTotal || browser.starting" @click="startSourceImport(true)">Import all<span class="num" x-text="browserTotal"></span></button>
            <button type="button" class="btn btn-sm btn-primary" :disabled="!browser.selected.length || browser.starting" @click="startSourceImport()"><span class="loading loading-spinner loading-xs" x-show="browser.starting"></span>Import<span class="num" x-show="browser.selected.length" x-text="browser.selected.length"></span></button>
          </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>Close</button></form>
      </dialog>
    </div>
  </template>

  <template id="page-keys">
    <div class="page" x-data="keys">
      <div class="page-head">
        <h1 class="title-page">API Keys</h1>
        <div class="row">
          <label class="input input-sm search-input">
            <ui-icon name="search" class="icon-sm text-subtle"></ui-icon>
            <input type="search" placeholder="Search name or key" x-model="query" @input="page = 1">
          </label>
          <button type="button" class="btn btn-sm btn-primary" @click="openForm()"><ui-icon name="plus" class="icon-sm"></ui-icon>New key</button>
        </div>
      </div>

      <section class="panel panel-flush">
        <div class="table-wrap">
          <table class="table table-sm">
            <thead>
              <tr><th>Name</th><th>Key</th><th>Plan</th><th>Route</th><th>Enabled</th><th>Created</th><th>Last used</th><th class="col-actions">Actions</th></tr>
            </thead>
            <tbody>
              <template x-for="item in paged" :key="item.id">
                <tr>
                  <td class="text-strong" x-text="item.name || '—'"></td>
                  <td><span class="mono copyable" title="Click to copy" x-text="item.key" @click="$copy(item.key)"></span></td>
                  <td x-text="item.plan.map((value) => ({ free: 'Free', plus: 'Plus', team: 'Team', pro: 'Pro' })[value]).join('、')"></td>
                  <td x-text="item.route.map((value) => ({ web: 'Web', codex: 'Codex' })[value]).join('、')"></td>
